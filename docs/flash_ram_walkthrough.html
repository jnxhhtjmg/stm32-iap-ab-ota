let i = 0, timer = null;
const el = id => document.getElementById(id);

function hex(b){ return b.toString(16).toUpperCase().padStart(2,'0'); }

function rows(rows){
  return rows.map(r => {
    const bytes = r.bytes.map((b,k) =>
      `<span class="b ${r.changed && r.changed.includes(k) ? 'ch' : ''}">${hex(b)}</span>`).join('');
    const tag = r.hl ? `<span class="tag">[${r.hl}]</span>` : '';
    return `<tr class="${r.hl||''}"><td class="addr">0x${r.addr.toString(16).toUpperCase().padStart(8,'0')}</td>` +
           `<td class="lbl">${r.label}${tag}</td><td><div class="bytes">${bytes}</div></td></tr>`;
  }).join('');
}

function render(){
  const s = STEPS[i];
  el('counter').textContent = `${i+1} / ${STEPS.length}`;
  el('desc').innerHTML = `<h3>${s.t}</h3><p>${s.d}</p><div class="code">${s.code}</div>`;
  el('regs').innerHTML = Object.entries(s.regs).map(([k,v]) => `<span><b>${k}</b>${v}</span>`).join('');
  el('flash').innerHTML = rows(s.flash);
  el('ram').innerHTML = rows(s.ram);
  el('ccm').innerHTML = rows(s.ccm);
  [...document.querySelectorAll('.step')].forEach((e,k)=>e.classList.toggle('on', k===i));
  el('prev').disabled = i===0;
  el('next').disabled = i===STEPS.length-1;
}

function build(){
  el('steps').innerHTML = STEPS.map((s,k)=>`<div class="step" data-k="${k}">${k+1}. ${s.t}</div>`).join('');
  [...document.querySelectorAll('.step')].forEach(e=>e.onclick=()=>{ stop(); i=+e.dataset.k; render(); });
}

function stop(){ if(timer){ clearInterval(timer); timer=null; el('play').textContent='自动播放'; } }

el('next').onclick = ()=>{ stop(); if(i<STEPS.length-1){ i++; render(); } };
el('prev').onclick = ()=>{ stop(); if(i>0){ i--; render(); } };
el('reset').onclick = ()=>{ stop(); i=0; render(); };
el('play').onclick = ()=>{
  if(timer){ stop(); return; }
  el('play').textContent='暂停';
  timer = setInterval(()=>{ if(i<STEPS.length-1){ i++; render(); } else stop(); }, 1800);
};

build(); render();
</script>
