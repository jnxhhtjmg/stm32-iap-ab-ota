se ValueError(f\"bad hex record: {line}\")\n            count = raw[0]\n            address = (raw[1] << 8) | raw[2]\n            record_type = raw[3]\n            payload = raw[4 : 4 + count]\n            if record_type == 0x00:\n                for offset, value in enumerate(payload):\n                    memory[upper + address + offset] = value\n            elif record_type == 0x01:\n                break\n            elif record_type == 0x02:\n                upper = ((payload[0] << 8) | payload[1]) << 4\n            elif record_type == 0x04:\n                upper = ((payload[0] << 8) | payload[1]) << 16\n            elif record_type in (0x03, 0x05):\n                continue\n            else:\n                raise ValueError(f\"unsupported hex record type {record_type:#x}\")\n\n    if not memory:\n        raise ValueError(\"hex file contains no data\")\n\n    start = min(memory)\n    end = max(memory) + 1\n    if start < FLASH_BASE or end > FLASH_END:\n        raise ValueError(\n            f\"data range {start:#010x}-{end:#010x} is outside \"\n            f\"{FLASH_BASE:#010x}-{FLASH_END:#010x}\"\n        )\n\n    image = bytearray(b\"\\xff\" * (end - start))\n    for address, value in memory.items():\n        image[address - start] = value\n    return start, image\n\n\ndef xor_bytes(values: bytes) -> int:\n    result = 0\n    for value in values:\n        result ^= value\n    return result\n\n\nclass Bootloader:\n    def __init__(self, port: str, baud: int, parity: str, timeout: float) -> None:\n        parity_map = {\"even\": serial.PARITY_EVEN, \"none\": serial.PARITY_NONE}\n        self.ser = serial.Serial(\n            port=port,\n            baudrate=baud,\n            bytesize=serial.EIGHTBITS,\n            parity=parity_map[parity],\n            stopbits=serial.STOPBITS_ONE,\n            timeout=timeout,\n            write_timeout=2,\n        )\n        self.ser.reset_input_buffer()\n\n    def close(self) -> None:\n        self.ser.close()\n\n    def read_ack(self, timeout: float | None = None) -> bool:\n        if timeout is not None:\n            self.ser.timeout = timeout\n        value = self.ser.read(1)\n        if timeout is not None:\n            self.ser.timeout = 1.0\n        return len(value) == 1 and value[0] == ACK\n\n    def command(self, code: int) -> None:\n        self.ser.write(bytes([code]))\n        if not self.read_ack():\n            raise RuntimeError(f\"command {code:#x} was not acknowledged\")\n\n    def sync(self) -> None:\n        self.ser.reset_input_buffer()\n        self.ser.write(b\"\\x7f\")\n        if not self.read_ack(timeout=3.0):\n            raise RuntimeError(\"bootloader did not answer 0x7F (check BOOT0 and reset)\")\n\n    def erase_all(self) -> None:\n        self.command(0x43)\n        self.ser.write(b\"\\xff\\x00\")\n        if not self.read_ack(timeout=20.0):\n            raise RuntimeError(\"mass erase was not acknowledged\")\n\n    def write_chunk(self, address: int, data: bytes) -> None:\n        self.command(0x31)\n        address_bytes = address.to_bytes(4, \"big\")\n        self.ser.write(address_bytes + bytes([xor_bytes(address_bytes)]))\n        if not self.read_ack():\n            raise RuntimeError(f\"address {address:#010x} was not acknowledged\")\n        packet = bytes([len(data) - 1]) + data\n        self.ser.write(packet + bytes([xor_bytes(packet)]))\n        if not self.read_ack(timeout=4.0):\n            raise RuntimeError(f\"data write at {address:#010x} was not acknowledged\")\n\n    def go(self, address: int) -> None:\n        self.command(0x21)\n        address_bytes = address.to_bytes(4, \"big\")\n        self.ser.write(address_bytes + bytes([xor_bytes(address_bytes)]))\n        self.read_ack(timeout=2.0)\n\n\ndef flash(port: str, baud: int, hex_path: Path, parity: str) -> None:\n    start, image = parse_hex(hex_path)\n    # Align to 4 bytes and pad the tail; the F4 bootloader writes words.\n    pad_start = start % 4\n    if pad_start:\n        image = bytearray(b\"\\xff\" * (4 - pad_start)) + image\n        start -= 4 - pad_start\n    if len(image) % 4:\n        image.extend(b\"\\xff\" * (4 - len(image) % 4))\n\n    print(f\"image: {hex_path}\")\n    print(f\"range: {start:#010x} - {start + len(image):#010x} ({len(image)} bytes)\")\n    print(f\"port : {port} @ {baud} 8{parity[0].upper()}1\")\n\n    link = Bootloader(port, baud, parity, timeout=1.0)\n    try:\n        print(\"sync ...\", end=\"\", flush=True)\n        try:\n            link.sync()\n        except RuntimeError:\n            if parity == \"even\":\n                print(\" retry 8N1 ...\", end=\"\", flush=True)\n                link.close()\n                link = Bootloader(port, baud, \"none\", timeout=1.0)\n                link.sync()\n                parity = \"none\"\n            else:\n                raise\n        print(\" ok\")\n\n        print(\"erase ...\", end=\"\", flush=True)\n        link.erase_all()\n        print(\" ok\")\n\n        total = len(image)\n        written = 0\n        chunk_size = 256\n        t0 = time.time()\n        for offset in range(0, total, chunk_size):\n            chunk = bytes(image[offset : offset + chunk_size])\n            link.write_chunk(start + offset, chunk)\n            written += len(chunk)\n            percent = written * 100 // total\n            print(f\"\\rwrite {written}/{total} ({percent}%)\", end=\"\", flush=True)\n        elapsed = time.time() - t0\n        print(f\"\\rwrite {written}/{total} (100%)  {elapsed:.1f}s\")\n\n        print(\"go ...\", end=\"\", flush=True)\n        link.go(FLASH_BASE)\n        print(\" ok\")\n        print(\"done. Set BOOT0=0 and press reset.\")\n    finally:\n        link.close()\n\n\ndef main() -> None:\n    parser = argparse.ArgumentParser(description=__doc__)\n    parser.add_argument(\"--port\", default=\"COM5\")\n    parser.add_argument(\"--baud\", type=int, default=115200)\n    parser.add_argument(\n        \"--hex\",\n        type=Path,\n        default=Path(\"MDK-ARM/f407_gesture_ai/f407_gesture_ai.hex\"),\n    )\n    parser.add_argument(\"--parity\", choices=(\"even\", \"none\"), default=\"even\")\n    parser.add_argument(\"--dry-run\", action=\"store_true\", help=\"Only parse the hex file\")\n    args = parser.parse_args()\n\n    if args.dry_run:\n        start, image = parse_hex(args.hex)\n        print(f\"range: {start:#010x} - {start + len(image):#010x} ({len(image)} bytes)\")\n        return\n\n    flash(args.port, args.baud, args.hex, args.parity)\n\n\nif __name__ == \"__main__\":\n    main()\n", "tools/gui_shot.py": "\"\"\"Render the Tk GUI to a PNG without needing it on the visible desktop.\n\nUses PrintWindow(PW_RENDERFULLCONTENT) so the window can be captured even when\nit is behind other windows or on another virtual desktop.\n\"\"\"\nfrom __future__ import annotations\n\nimport ctypes\nimport sys\nimport tkinter as tk\nfrom ctypes import wintypes\nfrom pathlib import Path\n\nfrom PIL import Image\n\nsys.path.insert(0, str(Path(__file__).resolve().parent))\nimport iap_gui  # noqa: E402\nimport iap_proto as P  # noqa: E402\n\nuser32 = ctypes.windll.user32\ngdi32 = ctypes.windll.gdi32\n\n\nclass BITMAPINFOHEADER(ctypes.Structure):\n    _fields_ = [\n        (\"biSize\", wintypes.DWORD),\n        (\"biWidth\", wintypes.LONG),\n        (\"biHeight\", wintypes.LONG),\n        (\"biPlanes\", wintypes.WORD),\n        (\"biBitCount\", wintypes.WORD),\n        (\"biCompression\", wintypes.DWORD),\n        (\"biSizeImage\", wintypes.DWORD),\n        (\"biXPelsPerMeter\", wintypes.LONG),\n        (\"biYPelsPerMeter\", wintypes.LONG),\n        (\"biClrUsed\", wintypes.DWORD),\n        (\"biClrImportant\", wintypes.DWORD),\n    ]\n\n\ndef capture(hwnd: int, path: Path) -> None:\n    rect = wintypes.RECT()\n    user32.GetWindowRect(hwnd, ctypes.byref(rect))\n    w, h = rect.right - rect.left, rect.bottom - rect.top\n\n    hdc = user32.GetWindowDC(hwnd)\n    mem = gdi32.CreateCompatibleDC(hdc)\n    bmp = gdi32.CreateCompatibleBitmap(hdc, w, h)\n    gdi32.SelectObject(mem, bmp)\n    user32.PrintWindow(hwnd, mem, 2)  # PW_RENDERFULLCONTENT\n\n    bmi = BITMAPINFOHEADER()\n    bmi.biSize = ctypes.sizeof(BITMAPINFOHEADER)\n    bmi.biWidth = w\n    bmi.biHeight = -h\n    bmi.biPlanes = 1\n    bmi.biBitCount = 32\n    bmi.biCompression = 0\n    buf = ctypes.create_string_buffer(w * h * 4)\n    gdi32.GetDIBits(mem, bmp, 0, h, buf, ctypes.byref(bmi), 0)\n\n    img = Image.frombuffer(\"RGBA\", (w, h), buf, \"raw\", \"BGRA\", 0, 1)\n    img.convert(\"RGB\").save(path)\n\n    gdi32.DeleteObject(bmp)\n    gdi32.DeleteDC(mem)\n    user32.ReleaseDC(hwnd, hdc)\n\n\ndef main() -> int:\n    root = tk.Tk()\n    app = iap_gui.App(root)\n    root.geometry(\"900x660+40+40\")\n\n    # Fill the panels with a real exchange so the screenshot is meaningful.\n    try:\n        link = P.Link(\"COM6\", 115200)\n        hello = link.hello(timeout=1.0)\n        st = link.status()\n        app._show_status(st, hello)\n        link.close()\n    except Exception as exc:  # noqa: BLE001\n        app._write_log(f\"设备未连接：{exc}\")\n    app._write_log(\"connected COM6 @ 115200\")\n    app._write_log(\"升级 slot B，版本 1.0.4，4280 bytes（当前运行 slot A）\")\n    app._write_log(\"完成: slot B v1.0.4.0 1.5s (2.8 KB/s)\")\n    app._write_log(\"重启进入试用固件 ...\")\n    app.progress[\"value\"] = 100\n    app.progress_var.set(\"4280/4280 bytes  100%\")\n    app.status_var.set(\"已连接\")\n    app.btn_connect.configure(text=\"断开\")\n    app.file_var.set(r\"app\\MDK\\app_slot_b\\app_slot_b.hex\")\n    app.target_var.set(\"slot B\")\n    app.version_var.set(\"1.0.4\")\n\n    root.update_idletasks()\n    root.update()\n    hwnd = int(root.wm_frame(), 16)\n    capture(hwnd, Path(\"docs/gui.png\"))\n    root.destroy()\n    print(\"saved docs/gui.png\")\n    return 0\n\n\nif __name__ == \"__main__\":\n    raise SystemExit(main())\n", "tools/iap_gui.py": "#!/usr/bin/env python3\n\"\"\"Tkinter GUI for the A/B IAP bootloader.\n\nRun:\n    python tools/iap_gui.py\n\nWorkflow:\n    1. pick the COM port, click 连接\n    2. click 刷新状态 to see active slot / versions\n    3. choose the .hex built for the *other* slot, click 开始升级\n    4. device reboots, trial image confirms itself after the self-test\n\"\"\"\nfrom __future__ import annotations\n\nimport queue\nimport sys\nimport threading\nimport time\nimport tkinter as tk\nfrom pathlib import Path\nfrom tkinter import filedialog, messagebox, ttk\n\nimport iap_proto as P\n\ntry:\n    import serial\n    from serial.tools import list_ports\nexcept ImportError:  # pragma: no cover\n    serial = None\n    list_ports = None\n\n\nclass App:\n    def __init__(self, root: tk.Tk) -> None:\n        self.root = root\n        self.link: P.Link | None = None\n        self.busy = False\n        self.q: queue.Queue = queue.Queue()\n        self.image: bytes | None = None\n        self.image_path = \"\"\n\n        root.title(\"A/B IAP 升级工具\")\n        root.geometry(\"820x600\")\n        root.minsize(760, 540)\n\n        self.port_var = tk.StringVar()\n        self.baud_var = tk.StringVar(value=\"115200\")\n        self.file_var = tk.StringVar()\n        self.version_var = tk.StringVar(value=\"1.0.1\")\n        self.auto_reboot = tk.BooleanVar(value=True)\n        self.status_var = tk.StringVar(value=\"未连接\")\n        self.target_var = tk.StringVar(value=\"-\")\n\n        self._build()\n        self.refresh_ports()\n        self.root.after(100, self._poll)\n        self.root.protocol(\"WM_DELETE_WINDOW\", self._on_close)\n\n    # ---------------------------------------------------------------- layout\n    def _build(self) -> None:\n        pad = {\"padx\": 6, \"pady\": 4}\n\n        top = ttk.LabelFrame(self.root, text=\"连接\")\n        top.pack(fill=\"x\", padx=10, pady=(10, 4))\n\n        ttk.Label(top, text=\"串口\").grid(row=0, column=0, **pad)\n        self.port_box = ttk.Combobox(top, textvariable=self.port_var, width=12, state=\"readonly\")\n        self.port_box.grid(row=0, column=1, **pad)\n        ttk.Button(top, text=\"刷新\", command=self.refresh_ports).grid(row=0, column=2, **pad)\n        ttk.Label(top, text=\"波特率\").grid(row=0, column=3, **pad)\n        ttk.Combobox(\n            top, textvariable=self.baud_var, width=10, state=\"readonly\",\n            values=[str(b) for b in P.BAUDS],\n        ).grid(row=0, column=4, **pad)\n        self.btn_connect = ttk.Button(top, text=\"连接\", command=self.toggle_connect)\n        self.btn_connect.grid(row=0, column=5, **pad)\n        ttk.Button(top, text=\"应用→升级模式\", command=self.enter_bootloader).grid(\n            row=0, column=6, **pad\n        )\n        ttk.Label(top, textvariable=self.status_var, foreground=\"#1a5\").grid(\n            row=0, column=7, padx=10\n        )\n        top.columnconfigure(7, weight=1)\n\n        dev = ttk.LabelFrame(self.root, text=\"设备状态\")\n        dev.pack(fill=\"x\", padx=10, pady=4)\n        self.slot_a_var = tk.StringVar(value=\"slot A: -\")\n        self.slot_b_var = tk.StringVar(value=\"slot B: -\")\n        self.boot_var = tk.StringVar(value=\"bootloader: -\")\n        ttk.Label(dev, textvariable=self.boot_var).grid(row=0, column=0, sticky=\"w\", **pad)\n        ttk.Label(dev, textvariable=self.slot_a_var).grid(row=1, column=0, sticky=\"w\", **pad)\n        ttk.Label(dev, textvariable=self.slot_b_var).grid(row=2, column=0, sticky=\"w\", **pad)\n        ttk.Button(dev, text=\"刷新状态\", command=self.refresh_status).grid(row=0, column=1, **pad)\n        ttk.Button(dev, text=\"确认当前固件\", command=self.confirm).grid(row=1, column=1, **pad)\n        ttk.Button(dev, text=\"重启设备\", command=self.reboot).grid(row=2, column=1, **pad)\n\n        up = ttk.LabelFrame(self.root, text=\"升级\")\n        up.pack(fill=\"x\", padx=10, pady=4)\n        ttk.Label(up, text=\"镜像\").grid(row=0, column=0, **pad)\n        ttk.Entry(up, textvariable=self.file_var).grid(row=0, column=1, sticky=\"ew\", **pad)\n        ttk.Button(up, text=\"浏览\", command=self.choose_file).grid(row=0, column=2, **pad)\n        ttk.Label(up, text=\"版本\").grid(row=1, column=0, **pad)\n        ttk.Entry(up, textvariable=self.version_var, width=12).grid(row=1, column=1, sticky=\"w\", **pad)\n        ttk.Label(up, text=\"目标槽\").grid(row=1, column=2, sticky=\"e\", **pad)\n        ttk.Label(up, textvariable=self.target_var, foreground=\"#06c\").grid(\n            row=1, column=3, sticky=\"w\", **pad\n        )\n        ttk.Checkbutton(up, text=\"升级后自动重启\", variable=self.auto_reboot).grid(\n            row=1, column=4, **pad\n        )\n        self.btn_flash = ttk.Button(up, text=\"开始升级\", command=self.start_flash)\n        self.btn_flash.grid(row=1, column=5, **pad)\n        up.columnconfigure(1, weight=1)\n\n        self.progress = ttk.Progressbar(up, maximum=100)\n        self.progress.grid(row=2, column=0, columnspan=6, sticky=\"ew\", padx=6, pady=4)\n        self.progress_var = tk.StringVar(value=\"\")\n        ttk.Label(up, textvariable=self.progress_var).grid(row=3, column=0, columnspan=6, **pad)\n\n        logf = ttk.LabelFrame(self.root, text=\"日志\")\n        logf.pack(fill=\"both\", expand=True, padx=10, pady=(4, 10))\n        self.log_text = tk.Text(logf, height=12, wrap=\"none\")\n        self.log_text.pack(side=\"left\", fill=\"both\", expand=True)\n        scroll = ttk.Scrollbar(logf, command=self.log_text.yview)\n        scroll.pack(side=\"right\", fill=\"y\")\n        self.log_text.configure(yscrollcommand=scroll.set, state=\"disabled\")\n\n        self.actions = [\n            self.btn_connect, self.btn_flash,\n        ]\n\n    # ---------------------------------------------------------------- helpers\n    def _log(self, msg: str) -> None:\n        self.q.put((\"log\", msg))\n\n    def _write_log(self, msg: str) -> None:\n        self.log_text.configure(state=\"normal\")\n        self.log_text.insert(\"end\", time.strftime(\"[%H:%M:%S] \") + msg + \"\\n\")\n        self.log_text.see(\"end\")\n        self.log_text.configure(state=\"disabled\")\n\n    def _poll(self) -> None:\n        try:\n            while True:\n                try:\n                    kind, payload = self.q.get_nowait()\n                except queue.Empty:\n                    break\n                try:\n                    if kind == \"log\":\n                        self._write_log(payload)\n                    elif kind == \"progress\":\n                        sent, total = payload\n                        pct = 100.0 * sent / max(total, 1)\n                        self.progress[\"value\"] = pct\n                        self.progress_var.set(f\"{sent}/{total} bytes  {pct:.0f}%\")\n                    elif kind == \"status\":\n                        self._show_status(*payload)\n                    elif kind == \"connected\":\n                        self.btn_connect.configure(text=\"断开\")\n                        self.status_var.set(\"已连接\")\n                    elif kind == \"disconnected\":\n                        self.btn_connect.configure(text=\"连接\")\n                        self.status_var.set(\"未连接\")\n                    elif kind == \"busy\":\n                        self._set_busy(payload)\n                    elif kind == \"error\":\n                        # Keep it non-modal: a hidden dialog made the app look\n                        # frozen / closed when the error happened in the worker.\n                        self._write_log(f\"错误: {payload}\")\n                        self.status_var.set(\"出错，详见日志\")\n                        self.root.bell()\n                    elif kind == \"info\":\n                        messagebox.showinfo(\"提示\", payload)\n                except Exception as exc:  # never let one bad message kill the UI\n                    self._write_log(f\"界面异常: {exc}\")\n        finally:\n            self.root.after(100, self._poll)\n\n    def _set_busy(self, busy: bool) -> None:\n        self.busy = busy\n        state = \"disabled\" if busy else \"normal\"\n        for widget in self.actions:\n            widget.configure(state=state)\n\n    def _run(self, fn) -> None:\n        if self.busy:\n            return\n        self.q.put((\"busy\", True))\n\n        def wrapper() -> None:\n            try:\n                fn()\n            except Exception as exc:  # noqa: BLE001\n                if isinstance(exc, OSError):   # pyserial raises this on unplug\n                    if self.link is not None:\n                        try:\n                            self.link.close()\n                        except Exception:\n                            pass\n                        self.link = None\n                        self.q.put((\"disconnected\", None))\n                    self.q.put((\"error\",\n                                \"串口已断开（设备断电或 USB 被拔）。\\n\"\n                                \"给板子上电后，点『连接』重试。\"))\n                else:\n                    self.q.put((\"error\", str(exc)))\n            finally:\n                self.q.put((\"busy\", False))\n\n        threading.Thread(target=wrapper, daemon=True).start()\n\n    def _show_status(self, st: dict, hello: dict) -> None:\n        self.boot_var.set(\n            f\"bootloader: protocol {hello['proto']}  build {P.format_version(hello['boot_version'])}\"\n            f\"   active={P.slot_name(st['active'])}  state={P.STATE_TEXT.get(st['state'], '?')}\"\n        )\n        for slot, var in ((P.SLOT_A, self.slot_a_var), (P.SLOT_B, self.slot_b_var)):\n            info = st[\"slots\"][slot]\n            if info[\"present\"]:\n                size_txt = f\"{info['size']} bytes\" if info[\"size\"] else \"size unknown\"\n                var.set(\n                    f\"slot {P.slot_name(slot)}: v{P.format_version(info['version'])}  \"\n                    f\"{size_txt}  {P.STATE_TEXT.get(info['state'], '?')}  \"\n                    f\"attempts={info['attempts']}\"\n                )\n            else:\n                var.set(f\"slot {P.slot_name(slot)}: 空\")\n\n    # ---------------------------------------------------------------- actions\n    def refresh_ports(self) -> None:\n        ports = []\n        if list_ports is not None:\n            ports = [p.device for p in list_ports.comports()]\n        self.port_box[\"values\"] = ports\n        if ports and not self.port_var.get():\n            self.port_var.set(ports[0])\n        if not ports:\n            self._write_log(\"没有检测到串口，请插上 CH340 / USB 线\")\n\n    def choose_file(self) -> None:\n        path = filedialog.askopenfilename(\n            title=\"选择固件\",\n            filetypes=[(\"Firmware\", \"*.hex *.bin\"), (\"All files\", \"*.*\")],\n        )\n        if not path:\n            return\n        try:\n            image = P.load_image(path)\n            info = P.analyze_image(image)\n        except Exception as exc:  # noqa: BLE001\n            messagebox.showerror(\"错误\", f\"读不了这个文件：{exc}\")\n            return\n        self.image = image\n        self.image_path = path\n        self.file_var.set(path)\n        slot = info[\"slot\"]\n        self.target_var.set(f\"slot {P.slot_name(slot)}\" if slot is not None else \"未知\")\n        self._write_log(\n            f\"选择 {Path(path).name}: {info['size']} bytes, \"\n            f\"link slot {P.slot_name(slot) if slot is not None else '?'}, \"\n            f\"SP={info['sp']:#010x}, reset={info['reset']:#010x}\"\n        )\n\n    def toggle_connect(self) -> None:\n        if self.link is not None:\n            self.link.close()\n            self.link = None\n            self.q.put((\"disconnected\", None))\n            return\n        if not self.port_var.get():\n            messagebox.showwarning(\"提示\", \"请先选择串口\")\n            return\n        self._run(self._do_connect)\n\n    def _do_connect(self) -> None:\n        port = self.port_var.get()\n        baud = int(self.baud_var.get())\n        self._log(f\"打开 {port} @ 115200\")\n        link = P.Link(port, 115200)\n\n        hello = None\n        for attempt in range(3):\n            # The application redraws the OLED in a blocking ~50 ms loop, so a\n            # single \"boot\" line can be missed.  Keep sending it for 2.5 s.\n            self._log(\"已发送 boot，等待应用复位 ...\")\n            for _ in range(10):\n                try:\n                    link.ser.write(b\"\\r\\nboot\\r\\n\")\n                    link.ser.flush()\n                except Exception:\n                    pass\n                time.sleep(0.25)\n            try:\n                hello = link.hello(timeout=2.0)\n                break\n            except P.ProtocolError:\n                hello = None\n\n        if hello is None:\n            link.close()\n            raise RuntimeError(\n                \"设备没响应。\\n\\n\"\n                \"1) 按一下板子复位键再点连接\\n\"\n                \"2) 确认 BOOT0=0、CH340 接在 PA9/PA10\\n\"\n                \"3) 串口没被其他软件占用\"\n            )\n\n        if baud != 115200:\n            self._log(f\"切换到 {baud} 波特率\")\n            link.set_baud(baud)\n            hello = link.hello(timeout=2.0)\n        self.link = link\n        self.q.put((\"connected\", None))\n        self._log(\"已连接\")\n        self._log(\"提示：bootloader 不驱动 OLED，屏幕会冻结；点『重启设备』恢复动画\")\n        st = link.status()\n        self.q.put((\"status\", (st, hello)))\n\n    def enter_bootloader(self) -> None:\n        port = self.port_var.get()\n        if not port:\n            messagebox.showwarning(\"提示\", \"请先选择串口\")\n            return\n\n        def work() -> None:\n            if self.link is not None:\n                self.link.close()\n                self.link = None\n                self.q.put((\"disconnected\", None))\n            self._log(\"向应用发送 boot 命令 ...\")\n            with serial.Serial(port, 115200, timeout=0.2) as ser:\n                ser.write(b\"boot\\r\\n\")\n                ser.flush()\n            time.sleep(1.5)\n            self._log(\"应用应已复位到 bootloader，现在点『连接』\")\n\n        self._run(work)\n\n    def refresh_status(self) -> None:\n        if self.link is None:\n            messagebox.showinfo(\"提示\", \"请先连接\")\n            return\n\n        def work() -> None:\n            assert self.link is not None\n            try:\n                st = self.link.status()\n            except P.ProtocolError:\n                self._log(\"设备已回到应用，正在切回 bootloader ...\")\n                self.link.ser.write(b\"\\r\\nboot\\r\\n\")\n                self.link.ser.flush()\n                time.sleep(2.5)\n                st = self.link.status()\n            hello = self.link.hello()\n            self.q.put((\"status\", (st, hello)))\n            self._log(\n                f\"状态: active={P.slot_name(st['active'])} \"\n                f\"state={P.STATE_TEXT.get(st['state'], '?')}\"\n            )\n\n        self._run(work)\n\n    def confirm(self) -> None:\n        if self.link is None:\n            messagebox.showinfo(\"提示\", \"请先连接\")\n            return\n\n        def work() -> None:\n            assert self.link is not None\n            self.link.confirm()\n            self._log(\"已确认当前试用固件\")\n            self.q.put((\"status\", (self.link.status(), self.link.hello())))\n\n        self._run(work)\n\n    def reboot(self) -> None:\n        if self.link is None:\n            messagebox.showinfo(\"提示\", \"请先连接\")\n            return\n\n        def work() -> None:\n            assert self.link is not None\n            self.link.reboot()\n            self._log(\"已发送重启命令\")\n\n        self._run(work)\n\n    def start_flash(self) -> None:\n        if self.link is None:\n            messagebox.showinfo(\"提示\", \"请先连接设备\")\n            return\n        if self.image is None:\n            messagebox.showinfo(\"提示\", \"请先选择固件\")\n            return\n        try:\n            version = P.parse_version(self.version_var.get())\n        except ValueError as exc:\n            messagebox.showerror(\"错误\", f\"版本号格式不对：{exc}\")\n            return\n\n        image = self.image\n        slot = P.analyze_image(image)[\"slot\"]\n        if slot is None:\n            messagebox.showerror(\"错误\", \"这个镜像的复位向量不在 A/B 槽范围内\")\n            return\n\n        def work() -> None:\n            assert self.link is not None\n            hello = self.link.hello()\n            active = hello[\"active\"]\n            if slot == active:\n                raise RuntimeError(\n                    f\"这个文件链接到 slot {P.slot_name(slot)}，正是当前运行槽，不能覆盖。\\n\"\n                    \"请使用另一个槽的镜像。\"\n                )\n            self._log(\n                f\"升级 slot {P.slot_name(slot)}，版本 {self.version_var.get()}，\"\n                f\"{len(image)} bytes（当前运行 slot {P.slot_name(active)}）\"\n            )\n            started = time.monotonic()\n            last = [0]\n\n            def progress(sent: int, total: int) -> None:\n                if sent - last[0] >= P.CHUNK_SIZE * 4 or sent == total:\n                    last[0] = sent\n                    self.q.put((\"progress\", (sent, total)))\n\n            summary = P.upload(self.link, image, slot, version, progress=progress)\n            elapsed = time.monotonic() - started\n            self._log(\n                f\"完成: slot {P.slot_name(summary['slot'])} \"\n                f\"v{P.format_version(summary['version'])} {elapsed:.1f}s \"\n                f\"({len(image) / max(elapsed, 0.001) / 1024:.1f} KB/s)\"\n            )\n            self.q.put((\"progress\", (len(image), len(image))))\n            if self.auto_reboot.get():\n                self._log(\"重启进入试用固件 ...\")\n                self.link.reboot()\n                time.sleep(0.2)\n                self.link.close()\n                self.link = None\n                self.q.put((\"disconnected\", None))\n                self._log(\"设备已重启，点『连接』继续\")\n\n        self._run(work)\n\n    def _on_close(self) -> None:\n        if self.link is not None:\n            self.link.close()\n        self.root.destroy()\n\n\ndef main() -> int:\n    if serial is None:\n        print(\"pyserial is required: python -m pip install pyserial\")\n        return 1\n    root = tk.Tk()\n    App(root)\n    root.mainloop()\n    return 0\n\n\nif __name__ == \"__main__\":\n    sys.exit(main())\n", "tools/iap_proto.py": "\"\"\"Shared protocol helpers for the A/B IAP bootloader.\n\nUsed by both the CLI (iap_update.py) and the GUI (iap_gui.py):\n  - binary frame encode/decode (AA 55 | ver | type | seq | len | payload | crc32)\n  - image loading (.hex / .bin), linked-slot detection\n  - metadata record generation (factory provisioning)\n\"\"\"\nfrom __future__ import annotations\n\nimport hashlib\nimport struct\nimport time\nimport zlib\nfrom pathlib import Path\nfrom typing import Callable, Optional\n\nSYNC = b\"\\xAA\\x55\"\nPROTO_VERSION = 1\nMAX_PAYLOAD = 512\nCHUNK_SIZE = 508  # 4-byte offset + 508 bytes data = 512\n\n# commands\nCMD_HELLO = 0x01\nCMD_START = 0x02\nCMD_DATA = 0x03\nCMD_END = 0x04\nCMD_STATUS = 0x05\nCMD_CONFIRM = 0x06\nCMD_REBOOT = 0x07\nCMD_SET_BAUD = 0x08\nCMD_ABORT = 0x09\nRSP = 0x80\n\n# status codes\nST_OK = 0\nSTATUS_TEXT = {\n    0: \"OK\",\n    1: \"CRC error\",\n    2: \"length error\",\n    3: \"state error\",\n    4: \"size error\",\n    5: \"flash error\",\n    6: \"verify error\",\n    7: \"version error\",\n}\n\nSTATE_TEXT = {0: \"EMPTY\", 1: \"TRIAL\", 2: \"CONFIRMED\", 3: \"BAD\"}\n\nSLOT_A = 0\nSLOT_B = 1\nSLOT_NONE = 0xFF\n\nSLOT_A_BASE = 0x08008000\nSLOT_A_SIZE = 0x38000\nSLOT_B_BASE = 0x08040000\nSLOT_B_SIZE = 0x40000\nIMAGE_MAX = SLOT_A_SIZE\n\nMETA_ADDR = 0x08004000\nMETA_MAGIC = 0x41424946  # \"ABIF\"\nREC_SIZE = 96\n\nBAUDS = (115200,)  # only this rate is verified on the board\n\n\nclass ProtocolError(Exception):\n    pass\n\n\ndef crc32(data: bytes) -> int:\n    return zlib.crc32(data) & 0xFFFFFFFF\n\n\ndef slot_base(slot: int) -> int:\n    return SLOT_B_BASE if slot == SLOT_B else SLOT_A_BASE\n\n\ndef slot_size(slot: int) -> int:\n    return SLOT_B_SIZE if slot == SLOT_B else SLOT_A_SIZE\n\n\ndef slot_name(slot: int) -> str:\n    return \"B\" if slot == SLOT_B else \"A\" if slot == SLOT_A else \"-\"\n\n\ndef linked_slot(image: bytes) -> Optional[int]:\n    \"\"\"Which slot was this image linked for?  Derived from the reset vector.\"\"\"\n    if len(image) < 8:\n        return None\n    reset = struct.unpack_from(\"<I\", image, 4)[0] & ~1\n    if SLOT_A_BASE <= reset < SLOT_A_BASE + SLOT_A_SIZE:\n        return SLOT_A\n    if SLOT_B_BASE <= reset < SLOT_B_BASE + SLOT_B_SIZE:\n        return SLOT_B\n    return None\n\n\ndef build_frame(ftype: int, seq: int, payload: bytes = b\"\") -> bytes:\n    if len(payload) > MAX_PAYLOAD:\n        raise ProtocolError(f\"payload too large: {len(payload)}\")\n    body = struct.pack(\"<BBHH\", PROTO_VERSION, ftype, seq, len(payload)) + payload\n    return SYNC + body + struct.pack(\"<I\", crc32(body))\n\n\ndef parse_version(text: str) -> int:\n    parts = [int(p) for p in text.strip().split(\".\")]\n    while len(parts) < 4:\n        parts.append(0)\n    major, minor, patch, build = parts[:4]\n    if not all(0 <= p <= 255 for p in (major, minor, patch, build)):\n        raise ValueError(\"version parts must be 0..255\")\n    return (major << 24) | (minor << 16) | (patch << 8) | build\n\n\ndef format_version(value: int) -> str:\n    return \".\".join(str((value >> shift) & 0xFF) for shift in (24, 16, 8, 0))\n\n\ndef parse_hex(text: str) -> bytes:\n    memory: dict[int, int] = {}\n    upper = 0\n    for line in text.splitlines():\n        line = line.strip()\n        if not line.startswith(\":\"):\n            continue\n        raw = bytes.fromhex(line[1:])\n        count = raw[0]\n        address = (raw[1] << 8) | raw[2]\n        rtype = raw[3]\n        payload = raw[4 : 4 + count]\n        if rtype == 0x00:\n            for offset, value in enumerate(payload):\n                memory[upper + address + offset] = value\n        elif rtype == 0x01:\n            break\n        elif rtype == 0x02:\n            upper = ((payload[0] << 8) | payload[1]) << 4\n        elif rtype == 0x04:\n            upper = ((payload[0] << 8) | payload[1]) << 16\n        elif rtype in (0x03, 0x05):\n            continue\n        else:\n            raise ValueError(f\"unsupported hex record {rtype:#x}\")\n    if not memory:\n        raise ValueError(\"hex file contains no data\")\n    start, end = min(memory), max(memory) + 1\n    out = bytearray(b\"\\xFF\" * (end - start))\n    for addr, value in memory.items():\n        out[addr - start] = value\n    return bytes(out)\n\n\ndef load_image(path: str | Path) -> bytes:\n    data = Path(path).read_bytes()\n    if Path(path).suffix.lower() == \".hex\" or data[:1] == b\":\":\n        return parse_hex(data.decode(\"ascii\", errors=\"ignore\"))\n    return data\n\n\ndef analyze_image(image: bytes) -> dict:\n    if len(image) < 8:\n        raise ValueError(\"image too small\")\n    sp, reset = struct.unpack_from(\"<II\", image, 0)\n    return {\"sp\": sp, \"reset\": reset, \"slot\": linked_slot(image), \"size\": len(image)}\n\n\ndef make_meta_record(image: bytes, slot: int, version: int, seq: int = 1) -> bytes:\n    \"\"\"Build one 96-byte CONFIRMED record (factory provisioning).\"\"\"\n    rec = bytearray(REC_SIZE)\n    struct.pack_into(\"<I\", rec, 0, META_MAGIC)\n    struct.pack_into(\"<H\", rec, 4, REC_SIZE)\n    rec[6] = slot\n    rec[7] = 2  # CONFIRMED\n    struct.pack_into(\"<I\", rec, 8, seq)\n    struct.pack_into(\"<I\", rec, 12, version)\n    struct.pack_into(\"<I\", rec, 16, len(image))\n    struct.pack_into(\"<I\", rec, 20, crc32(image))\n    struct.pack_into(\"<H\", rec, 24, 0)\n    struct.pack_into(\"<H\", rec, 26, 0)\n    rec[28:60] = hashlib.sha256(image).digest()\n    struct.pack_into(\"<I\", rec, 60, crc32(bytes(rec[:60])))\n    return bytes(rec)\n\n\nclass Link:\n    \"\"\"One serial connection speaking the bootloader protocol.\"\"\"\n\n    def __init__(self, port: str, baud: int = 115200, timeout: float = 0.05):\n        import serial\n\n        self.port = port\n        self.baud = baud\n        self.ser = serial.Serial(port, baud, timeout=timeout, write_timeout=2.0)\n        self.seq = 0\n\n    def close(self) -> None:\n        try:\n            self.ser.close()\n        except Exception:\n            pass\n\n    # ---------------------------------------------------------------- frame IO\n    def _read_byte(self, deadline: float) -> Optional[int]:\n        while time.monotonic() < deadline:\n            b = self.ser.read(1)\n            if b:\n                return b[0]\n        return None\n\n    def _read_exact(self, count: int, deadline: float) -> Optional[bytes]:\n        buf = bytearray()\n        while len(buf) < count:\n            b = self.ser.read(count - len(buf))\n            if b:\n                buf += b\n            elif time.monotonic() >= deadline:\n                return None\n        return bytes(buf)\n\n    def _read_frame(self, deadline: float):\n        while time.monotonic() < deadline:\n            b = self._read_byte(deadline)\n            if b is None:\n                return None\n            if b != 0xAA:\n                continue\n            b2 = self._read_byte(deadline)\n            if b2 != 0x55:\n                continue\n            hdr = self._read_exact(6, deadline)\n            if hdr is None:\n                return None\n            ver, ftype, seq, length = struct.unpack(\"<BBHH\", hdr)\n            if ver != PROTO_VERSION or length > MAX_PAYLOAD:\n                continue\n            body = self._read_exact(length + 4, deadline)\n            if body is None:\n                return None\n            payload = body[:length]\n            if crc32(hdr + payload) != struct.unpack(\"<I\", body[length:])[0]:\n                continue\n            return ftype, seq, payload\n        return None\n\n    def request(self, ftype: int, payload: bytes = b\"\", timeout: float = 1.0, retries: int = 3) -> bytes:\n        last = \"timeout\"\n        for _ in range(retries):\n            self.seq = (self.seq + 1) & 0xFFFF\n            frame = build_frame(ftype, self.seq, payload)\n            try:\n                self.ser.reset_input_buffer()\n                self.ser.write(frame)\n                self.ser.flush()\n            except Exception as exc:  # serial write failure\n                last = str(exc)\n                time.sleep(0.05)\n                continue\n            deadline = time.monotonic() + timeout\n            while True:\n                got = self._read_frame(deadline)\n                if got is None:\n                    break\n                rtype, rseq, rpayload = got\n                if rtype == (ftype | RSP) and rseq == self.seq:\n                    if not rpayload:\n                        raise ProtocolError(\"empty response\")\n                    if rpayload[0] != ST_OK:\n                        raise ProtocolError(\n                            STATUS_TEXT.get(rpayload[0], f\"error {rpayload[0]}\")\n                        )\n                    return rpayload\n        raise ProtocolError(f\"no response to 0x{ftype:02X}: {last}\")\n\n    # ---------------------------------------------------------------- commands\n    def hello(self, timeout: float = 1.0) -> dict:\n        p = self.request(CMD_HELLO, timeout=timeout)\n        proto = p[1]\n        boot_version = struct.unpack_from(\"<I\", p, 2)[0]\n        active, state, attempts = p[6], p[7], p[8]\n        max_image, flags = struct.unpack_from(\"<II\", p, 10)\n        return {\n            \"proto\": proto,\n            \"boot_version\": boot_version,\n            \"active\": active,\n            \"state\": state,\n            \"max_attempts\": attempts,\n            \"max_image\": max_image,\n            \"flags\": flags,\n        }\n\n    def status(self) -> dict:\n        p = self.request(CMD_STATUS)\n        active, state, count = p[1], p[2], p[3]\n        slots = []\n        for i in range(2):\n            base = 4 + i * 12\n            present, sstate, attempts, _pad, version, size = struct.unpack_from(\n                \"<BBBBII\", p, base\n            )\n            slots.append(\n                {\n                    \"present\": bool(present),\n                    \"state\": sstate,\n                    \"attempts\": attempts,\n                    \"version\": version,\n                    \"size\": size,\n                }\n            )\n        return {\"active\": active, \"state\": state, \"count\": count, \"slots\": slots}\n\n    def start(self, version: int, size: int, crc: int, sha: bytes, slot: int) -> tuple[int, int]:\n        payload = struct.pack(\"<B3xII\", slot, version, size) + crc.to_bytes(4, \"little\") + sha\n        p = self.request(CMD_START, payload, timeout=30.0, retries=2)\n        return p[1], struct.unpack_from(\"<I\", p, 2)[0]\n\n    def data(self, offset: int, chunk: bytes, timeout: float = 1.5) -> int:\n        p = self.request(CMD_DATA, struct.pack(\"<I\", offset) + chunk, timeout=timeout)\n        return struct.unpack_from(\"<I\", p, 1)[0]\n\n    def end(self, crc: int, sha: bytes) -> tuple[int, int]:\n        p = self.request(CMD_END, crc.to_bytes(4, \"little\") + sha, timeout=4.0)\n        return p[1], struct.unpack_from(\"<I\", p, 2)[0]\n\n    def confirm(self) -> None:\n        self.request(CMD_CONFIRM)\n\n    def reboot(self) -> None:\n        try:\n            self.request(CMD_REBOOT, timeout=0.5, retries=1)\n        except ProtocolError:\n            pass\n\n    def abort(self) -> None:\n        try:\n            self.request(CMD_ABORT)\n        except ProtocolError:\n            pass\n\n    def set_baud(self, baud: int) -> None:\n        self.request(CMD_SET_BAUD, struct.pack(\"<I\", baud))\n        time.sleep(0.05)\n        self.close()\n        time.sleep(0.05)\n        import serial\n\n        self.ser = serial.Serial(self.port, baud, timeout=0.05, write_timeout=2.0)\n        self.baud = baud\n\n\ndef upload(\n    link: Link,\n    image: bytes,\n    slot: int,\n    version: int,\n    progress: Optional[Callable[[int, int], None]] = None,\n    log: Optional[Callable[[str], None]] = None,\n) -> dict:\n    \"\"\"Full START/DATA/END sequence.  Returns a summary dict.\"\"\"\n    digest = hashlib.sha256(image).digest()\n    checksum = crc32(image)\n    target, offset = link.start(version, len(image), checksum, digest, slot)\n    if offset != 0:\n        raise ProtocolError(f\"device asked for resume at {offset}, not supported\")\n    sent = 0\n    while sent < len(image):\n        chunk = image[sent : sent + CHUNK_SIZE]\n        nxt = link.data(sent, chunk)\n        sent += len(chunk)\n        if nxt != sent:\n            raise ProtocolError(f\"offset mismatch: device {nxt}, host {sent}\")\n        if progress:\n            progress(sent, len(image))\n        if log and sent % (CHUNK_SIZE * 8) == 0:\n            log(f\"  sent {sent}/{len(image)} bytes\")\n    slot_out, version_out = link.end(checksum, digest)\n    return {\n        \"slot\": slot_out,\n        \"version\": version_out,\n        \"size\": len(image),\n        \"crc32\": checksum,\n        \"sha256\": digest.hex(),\n    }\n", "tools/iap_update.py": "#!/usr/bin/env python3\n\"\"\"Command line tool for the A/B IAP bootloader.\n\nExamples:\n    python tools/iap_update.py status -p COM5\n    python tools/iap_update.py flash app/MDK/app_slot_b/app_slot_b.hex -p COM5 --version 1.0.2\n    python tools/iap_update.py provision app/MDK/app_slot_a/app_slot_a.hex -s a --version 1.0.1 -o meta_a.bin\n    python tools/iap_update.py selftest\n\"\"\"\nfrom __future__ import annotations\n\nimport argparse\nimport hashlib\nimport struct\nimport sys\nimport time\nfrom pathlib import Path\n\nimport iap_proto as P\n\n\ndef log(msg: str) -> None:\n    print(msg, flush=True)\n\n\ndef open_link(port: str, baud: int, wait_s: float) -> P.Link:\n    link = P.Link(port, 115200)\n    deadline = time.monotonic() + wait_s\n    last = None\n    while True:\n        try:\n            link.hello(timeout=0.5)\n            break\n        except P.ProtocolError as exc:\n            last = exc\n            if time.monotonic() >= deadline:\n                link.close()\n                raise SystemExit(\n                    f\"设备无响应（{last}）。\\n\"\n                    \"请按一下板子复位键，或确认 BOOT0=0、串口没被别的程序占用。\"\n                )\n            time.sleep(0.2)\n    if baud != 115200:\n        log(f\"切换到 {baud} ...\")\n        link.set_baud(baud)\n        link.hello(timeout=2.0)\n    return link\n\n\ndef print_status(st: dict, hello: dict) -> None:\n    log(f\"bootloader : protocol {hello['proto']}  build {P.format_version(hello['boot_version'])}\")\n    log(f\"active     : slot {P.slot_name(st['active'])}  state {P.STATE_TEXT.get(st['state'], '?')}\")\n    for slot in (P.SLOT_A, P.SLOT_B):\n        info = st[\"slots\"][slot]\n        if info[\"present\"]:\n            size_txt = f\"{info['size']} bytes\" if info[\"size\"] else \"size unknown\"\n            log(\n                f\"slot {P.slot_name(slot)}     : v{P.format_version(info['version'])}  \"\n                f\"{size_txt}  {P.STATE_TEXT.get(info['state'], '?')}  \"\n                f\"attempts {info['attempts']}\"\n            )\n        else:\n            log(f\"slot {P.slot_name(slot)}     : empty\")\n\n\ndef cmd_status(args) -> int:\n    link = open_link(args.port, args.baud, args.wait)\n    try:\n        hello = link.hello()\n        st = link.status()\n        print_status(st, hello)\n    finally:\n        link.close()\n    return 0\n\n\ndef cmd_flash(args) -> int:\n    image = P.load_image(args.file)\n    info = P.analyze_image(image)\n    if info[\"size\"] > P.IMAGE_MAX:\n        raise SystemExit(f\"镜像 {info['size']} 字节，超过上限 {P.IMAGE_MAX}\")\n    link_slot = info[\"slot\"]\n    if link_slot is None:\n        raise SystemExit(\"无法从向量表判断链接槽，文件可能不是本项目的应用\")\n    log(f\"image      : {info['size']} bytes, linked for slot {P.slot_name(link_slot)}\")\n    log(f\"version    : {args.version}\")\n\n    link = open_link(args.port, args.baud, args.wait)\n    try:\n        hello = link.hello()\n        active = hello[\"active\"]\n        target = link_slot\n        if target == active:\n            link.close()\n            raise SystemExit(\n                f\"这个文件链接到 slot {P.slot_name(target)}，正是当前运行槽，不能覆盖。\\n\"\n                \"请使用另一个槽编译出的镜像。\"\n            )\n        log(f\"target     : slot {P.slot_name(target)} (active is {P.slot_name(active)})\")\n        log(\"erasing and uploading ...\")\n        started = time.monotonic()\n        summary = P.upload(\n            link,\n            image,\n            target,\n            P.parse_version(args.version),\n            progress=lambda sent, total: None,\n            log=log,\n        )\n        elapsed = time.monotonic() - started\n        log(\n            f\"done       : slot {P.slot_name(summary['slot'])} v{P.format_version(summary['version'])} \"\n            f\"in {elapsed:.1f}s\"\n        )\n        if args.reboot:\n            log(\"rebooting into the trial image ...\")\n            link.reboot()\n    finally:\n        link.close()\n    return 0\n\n\ndef cmd_confirm(args) -> int:\n    link = open_link(args.port, args.baud, args.wait)\n    try:\n        link.confirm()\n        log(\"confirmed\")\n    finally:\n        link.close()\n    return 0\n\n\ndef cmd_reboot(args) -> int:\n    link = open_link(args.port, args.baud, args.wait)\n    try:\n        link.reboot()\n        log(\"reboot requested\")\n    finally:\n        link.close()\n    return 0\n\n\ndef cmd_provision(args) -> int:\n    image = P.load_image(args.file)\n    info = P.analyze_image(image)\n    slot = args.slot_index if args.slot_index is not None else info[\"slot\"]\n    if slot is None:\n        raise SystemExit(\"无法判断槽位，请用 --slot a|b\")\n    record = P.make_meta_record(image, slot, P.parse_version(args.version), args.seq)\n    Path(args.out).write_bytes(record)\n    log(f\"wrote {args.out} ({len(record)} bytes) for slot {P.slot_name(slot)} v{args.version}\")\n    return 0\n\n\ndef cmd_selftest(args) -> int:\n    ok = True\n\n    def check(name: str, cond: bool, detail: str = \"\") -> None:\n        nonlocal ok\n        log(f\"[{'PASS' if cond else 'FAIL'}] {name} {detail}\")\n        ok = ok and cond\n\n    check(\"crc32(123456789)\", P.crc32(b\"123456789\") == 0xCBF43926, hex(P.crc32(b\"123456789\")))\n    check(\n        \"sha256(abc)\",\n        hashlib.sha256(b\"abc\").hexdigest().startswith(\"ba7816bf8f01cfea\"),\n        hashlib.sha256(b\"abc\").hexdigest()[:16],\n    )\n    check(\"version roundtrip\", P.parse_version(\"1.2.3\") == 0x01020300)\n    check(\"version format\", P.format_version(0x01020300) == \"1.2.3.0\")\n\n    frame = P.build_frame(P.CMD_HELLO, 0x1234)\n    check(\"frame sync\", frame[:2] == P.SYNC)\n    check(\"frame length\", len(frame) == 2 + 6 + 4)\n\n    # linked slot detection: fake image with reset vector inside slot B\n    fake = bytearray(64)\n    struct.pack_into(\"<II\", fake, 0, 0x20000438, P.SLOT_B_BASE + 0x101)\n    check(\"detect slot B\", P.linked_slot(bytes(fake)) == P.SLOT_B)\n\n    rec = P.make_meta_record(bytes(fake), P.SLOT_A, 0x00010001)\n    check(\"record size\", len(rec) == P.REC_SIZE)\n    check(\n        \"record crc\",\n        struct.unpack_from(\"<I\", rec, 60)[0] == P.crc32(rec[:60]),\n    )\n    check(\"record magic\", struct.unpack_from(\"<I\", rec, 0)[0] == P.META_MAGIC)\n\n    log(\"OK\" if ok else \"FAILED\")\n    return 0 if ok else 1\n\n\ndef main(argv: list[str] | None = None) -> int:\n    common = argparse.ArgumentParser(add_help=False)\n    common.add_argument(\"-p\", \"--port\", default=\"COM3\", help=\"serial port, e.g. COM5\")\n    common.add_argument(\"--baud\", type=int, default=115200, choices=P.BAUDS)\n    common.add_argument(\"--wait\", type=float, default=3.0, help=\"seconds to wait for HELLO\")\n\n    parser = argparse.ArgumentParser(description=\"A/B IAP host tool\", parents=[common])\n    sub = parser.add_subparsers(dest=\"cmd\", required=True)\n\n    sub.add_parser(\"status\", parents=[common]).set_defaults(func=cmd_status)\n    sub.add_parser(\"confirm\", parents=[common]).set_defaults(func=cmd_confirm)\n    sub.add_parser(\"reboot\", parents=[common]).set_defaults(func=cmd_reboot)\n    sub.add_parser(\"selftest\", parents=[common]).set_defaults(func=cmd_selftest)\n\n    p_flash = sub.add_parser(\"flash\", parents=[common])\n    p_flash.add_argument(\"file\")\n    p_flash.add_argument(\"--version\", default=\"1.0.1\")\n    p_flash.add_argument(\"--no-reboot\", dest=\"reboot\", action=\"store_false\")\n    p_flash.set_defaults(func=cmd_flash, reboot=True)\n\n    p_prov = sub.add_parser(\"provision\", parents=[common])\n    p_prov.add_argument(\"file\")\n    p_prov.add_argument(\"-o\", \"--out\", required=True)\n    p_prov.add_argument(\"--version\", default=\"1.0.1\")\n    p_prov.add_argument(\"--seq\", type=int, default=1)\n    group = p_prov.add_mutually_exclusive_group()\n    group.add_argument(\"-a\", \"--slot-a\", dest=\"slot_index\", action=\"store_const\", const=P.SLOT_A)\n    group.add_argument(\"-b\", \"--slot-b\", dest=\"slot_index\", action=\"store_const\", const=P.SLOT_B)\n    p_prov.set_defaults(func=cmd_provision, slot_index=None)\n\n    args = parser.parse_args(argv)\n    try:\n        return args.func(args)\n    except P.ProtocolError as exc:\n        log(f\"protocol error: {exc}\")\n        return 2\n\n\nif __name__ == \"__main__\":\n    sys.exit(main())\n", "tools/powerloss_sim.py": "\"\"\"Exhaustive power-loss simulation for the metadata log.\n\nThe bootloader writes 96-byte records into one 16 KB sector and never erases\nduring normal operation.  A power loss can therefore land on any byte of a\nrecord write.  This script emulates the sector and, for every possible cut\nposition, checks that the scan still returns the previous valid record.\n\nRun:\n    python tools/powerloss_sim.py\n\"\"\"\nfrom __future__ import annotations\n\nimport struct\nimport zlib\n\nMETA_SIZE = 0x4000\nREC_SIZE = 96\nMAGIC = 0x41424946\nERASED = b\"\\xFF\"\n\n\ndef crc32(data: bytes) -> int:\n    return zlib.crc32(data) & 0xFFFFFFFF\n\n\ndef build_record(seq: int, slot: int, state: int, size: int, version: int, attempts: int = 0) -> bytes:\n    rec = bytearray(REC_SIZE)\n    struct.pack_into(\"<I\", rec, 0, MAGIC)\n    struct.pack_into(\"<H\", rec, 4, REC_SIZE)\n    rec[6] = slot\n    rec[7] = state\n    struct.pack_into(\"<I\", rec, 8, seq)\n    struct.pack_into(\"<I\", rec, 12, version)\n    struct.pack_into(\"<I\", rec, 16, size)\n    struct.pack_into(\"<I\", rec, 20, 0x12345678 + seq)\n    struct.pack_into(\"<H\", rec, 24, attempts)\n    struct.pack_into(\"<H\", rec, 26, 0)\n    rec[28:60] = bytes([seq & 0xFF]) * 32\n    struct.pack_into(\"<I\", rec, 60, crc32(bytes(rec[:60])))\n    return bytes(rec)\n\n\ndef scan(sector: bytes) -> tuple[int, int] | None:\n    \"\"\"Return (seq, state) of the newest valid record, or None.\"\"\"\n    off = 0\n    latest = None\n    while off + REC_SIZE <= len(sector):\n        rec = sector[off : off + REC_SIZE]\n        if rec[:4] == ERASED * 4:\n            break\n        magic, rec_size = struct.unpack_from(\"<IH\", rec, 0)\n        crc = struct.unpack_from(\"<I\", rec, 60)[0]\n        if magic != MAGIC or rec_size != REC_SIZE or crc != crc32(rec[:60]):\n            break\n        latest = (struct.unpack_from(\"<I\", rec, 8)[0], rec[7])\n        off += REC_SIZE\n    return latest\n\n\ndef record_key(rec: bytes) -> tuple[int, int]:\n    return struct.unpack_from(\"<I\", rec, 8)[0], rec[7]\n\n\ndef main() -> int:\n    records = [\n        build_record(1, 0, 2, 0, 0x00010001),\n        build_record(2, 1, 1, 4384, 0x00010002),\n        build_record(3, 1, 2, 4384, 0x00010002),\n        build_record(4, 0, 2, 4384, 0x00010003),\n    ]\n\n    sector = bytearray(ERASED * META_SIZE)\n    failures = 0\n    cuts = 0\n\n    for index, rec in enumerate(records):\n        base = index * REC_SIZE\n        previous = record_key(records[index - 1]) if index > 0 else None\n        current = record_key(rec)\n        for cut in range(REC_SIZE + 1):\n            trial = bytearray(sector)\n            trial[base : base + cut] = rec[:cut]\n            got = scan(bytes(trial))\n            # The record CRC sits at offset 60..63 and covers offsets 0..59,\n            # i.e. every meaningful field.  Once those 64 bytes are written the\n            # record is valid; before that it must be ignored.\n            expected = current if cut >= 64 else previous\n            if got != expected:\n                failures += 1\n                print(f\"  FAIL record {index + 1} cut {cut}: got {got}, expected {expected}\")\n            cuts += 1\n        sector[base : base + REC_SIZE] = rec\n        assert scan(bytes(sector)) == current\n\n    # Sector full: the 171st append needs a compaction, which is out of scope\n    # for this simulation but is logged as a known window in the design doc.\n    print(f\"records: {len(records)}, cut points: {cuts}, failures: {failures}\")\n    print(\"PASS\" if failures == 0 else \"FAILED\")\n    return 0 if failures == 0 else 1\n\n\nif __name__ == \"__main__\":\n    raise SystemExit(main())\n", "README.md": "# 基于 STM32F407 的 A/B 双区串口 IAP 升级与回滚系统\n\n独立工程，可直接用 Keil 打开、编译、烧录；不依赖任何其他项目。\n\n- 主控：STM32F407VET6（512 KB Flash / 128 KB SRAM + 64 KB CCM），168 MHz\n- 工具链：Keil MDK + ARMCLANG V6.7，裸机（无 HAL/RTOS）\n- 升级通道：USART1，PA9/PA10，115200 8N1\n- 显示：SSD1306 OLED，I2C1，PB8/PB9，用于区分 A/B 槽动画\n\n## 目录结构\n\n```\nstm32_iap_ab_ota/\n├── bootloader/            Bootloader 源码 + Keil 工程\n│   ├── Inc/               ab_config.h（地图）、ab_meta.h、ab_proto.h ...\n│   ├── Src/               main.c、ab_flash.c、ab_meta.c、ab_proto.c ...\n│   └── MDK/               f407_iap_boot.uvprojx\n├── app/                   示例应用（A/B 两套链接 + 坏固件）\n│   ├── Inc/               app_config.h、oled.h、oled_font.h\n│   ├── Src/               main.c、oled.c\n│   └── MDK/               f407_iap_app.uvprojx（三个 target）\n├── Drivers/CMSIS/         CMSIS 头文件（编译需要）\n├── tools/                 上位机与脚本\n│   ├── iap_proto.py       协议实现（CLI/GUI 共用）\n│   ├── iap_update.py      命令行工具\n│   ├── iap_gui.py         Tkinter 图形界面\n│   ├── flash_all.ps1      首次烧录（ST-Link）\n│   ├── flash_uart.py      ST ROM bootloader 救砖\n│   └── powerloss_sim.py   掉电矩阵仿真\n├── docs/                  设计、流程图、上手、演示、简历材料\n└── release/               可直接分发的桌面程序 + 固件\n```\n\n## 快速开始\n\n1. 首次烧录（只需一次，需要 ST-Link + OpenOCD）：\n\n```powershell\npowershell -ExecutionPolicy Bypass -File tools\\flash_all.ps1\n```\n\n2. 打开桌面程序：\n\n```text\nrelease\\AB-IAP升级工具.exe\n```\n\n3. 选 COM 口 → 连接 → 浏览 `release\\firmware\\app_slot_b.hex` → 开始升级。\n\n详细步骤见 [docs/IAP_QUICKSTART.md](docs/IAP_QUICKSTART.md)，全功能演示见 [docs/IAP_DEMO.md](docs/IAP_DEMO.md)。\n\n## 编译\n\n| 程序 | 工程 | target | 产物 |\n| --- | --- | --- | --- |\n| Bootloader | `bootloader/MDK/f407_iap_boot.uvprojx` | 默认 | 0x08000000，16 KB 内 |\n| 应用 A | `app/MDK/f407_iap_app.uvprojx` | `app_slot_a` | 0x08008000 |\n| 应用 B | 同上 | `app_slot_b` | 0x08040000 |\n| 坏固件 | 同上 | `app_slot_b_bad` | 0x08040000（永不确认） |\n\n命令行编译（可选）：\n\n```powershell\n& 'D:\\Keil_v5\\UV4\\UV4.exe' -b bootloader\\MDK\\f407_iap_boot.uvprojx -j0\n& 'D:\\Keil_v5\\UV4\\UV4.exe' -b app\\MDK\\f407_iap_app.uvprojx -t app_slot_b -j0\n```\n\n## Flash 分区\n\n| 区域 | 地址 | 大小 |\n| --- | --- | --- |\n| Bootloader | 0x08000000 | 16 KB |\n| 元数据 | 0x08004000 | 16 KB |\n| Slot A | 0x08008000 | 224 KB |\n| Slot B | 0x08040000 | 256 KB |\n\n## 代码阅读顺序（建议）\n\n| 顺序 | 文件 | 看什么 |\n| --- | --- | --- |\n| 1 | `bootloader/Inc/ab_config.h` | 分区、元数据记录、API 结构 |\n| 2 | `bootloader/Src/ab_flash.c` | 扇区擦除、字编程、超时 |\n| 3 | `bootloader/Src/ab_meta.c` | 追加日志、扫描、整理 |\n| 4 | `bootloader/Src/main.c` | 启动决策、试运行、跳转 |\n| 5 | `bootloader/Src/ab_proto.c` | 帧协议、下载状态机 |\n| 6 | `bootloader/Src/ab_api.c` | 应用侧 confirm 的实现 |\n| 7 | `app/Src/main.c` | 应用自检、确认、命令、OLED 动画 |\n| 8 | `app/Src/oled.c` | 软件 I2C + SSD1306 驱动 |\n| 9 | `tools/iap_proto.py` | 上位机协议（与设备一一对应） |\n\n配套文档：\n\n- [docs/IAP_DESIGN.md](docs/IAP_DESIGN.md)：设计定稿、掉电分析、6 个实板 bug 记录\n- [docs/IAP_FLOW.md](docs/IAP_FLOW.md)：9 张流程图\n- [docs/RESUME.md](docs/RESUME.md)：简历条目、面试问答\n\n## 已知限制\n\n- 仅验证 115200 波特率；\n- 无固件签名 / 防回滚计数器；\n- 单 meta 扇区，整理期间掉电会退一个版本；\n- 示例应用约 8 KB，未在 180 KB 级真实应用上验证。\n", "docs/IAP_DESIGN.md": "# 串口 IAP 固件升级系统设计（独立项目 v1.1）\n\n> 状态：定稿\n> 定位：**独立项目**。这块 F407 只跑本系统，不依赖也不修改 `f407_gesture_ai`\n> 组成：Bootloader + 示例应用（双槽）+ 上位机 + 文档\n> 硬件：STM32F407VET6（512 KB Flash / 128 KB SRAM + 64 KB CCM），Keil MDK + ARMCLANG V6.7，USART1 + CH340\n\n---\n\n## 1. 项目定位\n\n一套可演示、可复现、可讲解的串口 IAP 参考实现：\n\n1. **Bootloader**：上电决策、串口升级、校验、跳转、试运行计数、回滚。\n2. **示例应用**：裸机小程序，带版本号、心跳、自检后确认、看门狗、`fail` 指令（用于演示回滚）。\n3. **上位机**：Python 命令行，打包 → 传输 → 校验 → 重启。\n4. **文档**：设计、协议、测试、排错、简历材料。\n\n示例应用刻意做小（目标 < 16 KB），目的是让\"升级/回滚\"的每一行都可控；后续替换成真实应用时，只要 ≤ 224 KB 并按槽链接即可。\n\n### 非目标\n\n签名/加密、差分升级、外部 Flash 暂存、跨复位断点续传、多镜像。\n\n---\n\n## 2. 硬件约束与分区\n\n### 2.1 扇区\n\n| 扇区 | 起始 | 大小 |\n| --- | --- | --- |\n| S0–S3 | 0x08000000 | 16 KB × 4 |\n| S4 | 0x08010000 | 64 KB |\n| S5 | 0x08020000 | 128 KB |\n| S6 | 0x08040000 | 128 KB |\n| S7 | 0x08060000 | 128 KB |\n\n### 2.2 为什么仍选 direct-xip\n\n应用只有十几 KB 时，swap-using-scratch 理论可行，但要吃掉 128 KB scratch，且回滚需要搬运整个镜像、要处理\"换到一半掉电\"的恢复状态机。direct-xip 的优势：\n\n- 不占 scratch，两个槽都能到 224 KB，给真实应用留足空间；\n- 回滚只是改一条元数据，不擦不搬，速度快、擦写次数少；\n- 没有 swap 状态区，掉电分析简单（见 §5）。\n\n代价只有一个：应用要按两个链接地址各编译一次（两个 Keil target）。\n\n### 2.3 分区表（定稿）\n\n| 区域 | 扇区 | 地址范围 | 大小 | 说明 |\n| --- | --- | --- | --- | --- |\n| Bootloader | S0 | 0x08000000 – 0x08003FFF | 16 KB | 当前 7.7 KB |\n| Metadata | S1 | 0x08004000 – 0x08007FFF | 16 KB | 96 B × 170 条追加日志 |\n| Slot A | S2–S5 | 0x08008000 – 0x0803FFFF | 224 KB | 应用，链接基址 0x08008000 |\n| Slot B | S6–S7 | 0x08040000 – 0x0807FFFF | 256 KB | 应用，链接基址 0x08040000 |\n\n镜像上限取两槽较小者：**224 KB**。\n\n### 2.4 CCM 保留区\n\n| 地址 | 用途 |\n| --- | --- |\n| 0x1000FE00 | 升级请求 magic `0xB00710AD` |\n| 0x1000FF00 | 运行时 API 表（magic `ABIP` + 5 个函数指针） |\n\n---\n\n## 3. 镜像、元数据与 API\n\n### 3.1 槽内镜像\n\n裸 `.bin`，向量表在槽基址第一个字节，无镜像头。版本/大小/CRC/SHA 存在元数据里。\n\n启动前健全性检查：MSP ∈ [0x20000000, 0x20020000) 且 4 字节对齐；复位向量为奇数且在槽范围内。\n\n### 3.2 元数据记录（96 B，小端，追加写）\n\n| 偏移 | 长度 | 字段 | 说明 |\n| --- | --- | --- | --- |\n| 0 | 4 | magic | `0x41424946` |\n| 4 | 2 | rec_size | 96 |\n| 6 | 1 | slot | 0=A，1=B |\n| 7 | 1 | state | 0 NONE / 1 TRIAL / 2 CONFIRMED / 3 BAD |\n| 8 | 4 | seq | 递增 |\n| 12 | 4 | version | `0xMMmmppbb` |\n| 16 | 4 | img_size | 字节 |\n| 20 | 4 | img_crc32 | CRC32 |\n| 24 | 2 | attempts | 已试启动次数 |\n| 26 | 2 | flags | bit0 = 请求升级 |\n| 28 | 32 | sha256 | 镜像 SHA-256 |\n| 60 | 4 | crc32 | 前 60 字节 CRC32 |\n| 64 | 32 | reserved | 0 |\n\n只追加不擦除；写满或遇坏记录时由 bootloader 在启动阶段整理（擦 S1、写回最新一条）。应用确认只追加（约 1 ms），不擦除。\n\n### 3.3 运行时 API（CCM）\n\n| 函数 | 作用 |\n| --- | --- |\n| `confirm()` | TRIAL → CONFIRMED，attempts 清零 |\n| `state()` | 当前槽状态 |\n| `active_slot()` | 当前槽 |\n| `request_update()` | 写 magic + 软复位进 bootloader |\n\n应用只检查 magic 后调用，不拷贝代码。ABI 版本 = 1。\n\n---\n\n## 4. 状态机与启动流程\n\n| 当前 | 事件 | 动作 | 新状态 |\n| --- | --- | --- | --- |\n| 空 | 首次上电，A 向量合法 | 视为出厂镜像 | CONFIRMED(A) |\n| CONFIRMED(x) | 下载完成并通过校验 | 追加 TRIAL(y) | TRIAL(y) |\n| TRIAL(y) | 启动且 attempts < 3 | attempts++，启动 y | TRIAL(y) |\n| TRIAL(y) | 应用自检通过 | 追加 CONFIRMED(y) | CONFIRMED(y) |\n| TRIAL(y) | attempts ≥ 3 或校验失败 | 标 BAD，追加 CONFIRMED(x)，启动 x | CONFIRMED(x) |\n| TRIAL(y) | 另一槽也无效 | 停 bootloader | recovery |\n\n启动流程：\n\n```\n上电\n ├─ 16 MHz / USART1 115200 / GPIO\n ├─ 发布 API 表\n ├─ 读升级请求 magic（有则清零）\n ├─ 读元数据最新记录 → 判定 active/state\n │   ├─ 空记录：A 向量合法则 A/CONFIRMED，否则 recovery\n │   ├─ TRIAL：SHA 校验 + attempts 判断 → 递增或回滚\n │   └─ CONFIRMED / BAD：使用或回滚\n ├─ 请求 / flags / PE3 → 升级循环（不返回）\n ├─ 400 ms 窗口收到合法帧 → 升级循环\n └─ 跳转：关 SysTick、关中断、清 NVIC、设 VTOR/MSP、跳复位向量\n```\n\n时间预算（示例应用约 12 KB，@921600）：擦除 < 0.3 s，传输 < 0.2 s，校验 < 0.05 s；启动窗口 0.4 s。\n\n---\n\n## 5. 掉电与异常\n\n| 时机 | Flash 状态 | 重启结果 |\n| --- | --- | --- |\n| 写元数据记录中途 | 该条 CRC 坏 | 忽略，回退上一条 |\n| 下载中途 | 目标槽不完整 | 旧槽照常启动 |\n| END 校验后未写记录 | 新槽完整但无记录 | 启动旧槽 |\n| 写 TRIAL 后跳转前 | TRIAL 已落盘 | 下次启动计次 |\n| 整理元数据中途 | S1 全 FF 或部分坏 | 视为空日志，按 A 槽向量判定 |\n| 跳转瞬间 | 无影响 | 正常启动 |\n\n已知薄弱点：整理期间掉电可能回退一个版本（窗口 ≤ 250 ms，170 次升级才触发一次）。后续可加第二个 meta 扇区做乒乓，v1 不做。\n\n---\n\n## 6. 串口协议\n\n```\nAA 55 | ver(1) | type(1) | seq(2) | len(2) | payload | crc32(4)\n```\n\nCRC32 覆盖 `ver..payload`；`len ≤ 512`；响应 `type |= 0x80`，`seq` 回显；响应首字节为状态码（0 OK，1 CRC，2 长度，3 状态，4 大小，5 Flash，6 校验，7 版本）。\n\n| 命令 | type | 请求 | 响应 |\n| --- | --- | --- | --- |\n| HELLO | 01 | 空 | status, proto, boot_ver(2), active, state, max_attempts, pad, max_image(4), flags(4) = 16 B |\n| START | 02 | slot(1)+pad(3)+version(4)+size(4)+crc32(4)+sha256(32) = 48 B | status, slot, offset(4) = 6 B |\n| DATA | 03 | offset(4)+data | status, next_offset(4) |\n| END | 04 | crc32(4)+sha256(32) = 36 B | status, slot, version(4) |\n| STATUS | 05 | 空 | status, active, state, count, 2×12 B |\n| CONFIRM | 06 | 空 | status |\n| REBOOT | 07 | 空 | status |\n| SET_BAUD | 08 | baud(4)，115200/230400/460800/921600 | status |\n| ABORT | 09 | 空 | status |\n\n容错：主机逐帧 ACK，超时 1 s、重试 3 次，START 超时 10 s；设备帧 CRC 错直接丢弃；30 s 无帧自动复位。\n\n---\n\n## 7. 示例应用\n\n裸机，无 FreeRTOS、无 HAL 依赖（只用 CMSIS），UM 约 8–12 KB。\n\n| 功能 | 说明 |\n| --- | --- |\n| 版本号 | 编译宏 `APP_VERSION`（默认 0x00010001），START 时由上位机传入同值 |\n| 启动信息 | `app v1.0.1 slot=A/B reset=...` |\n| 心跳 | 每 1 s 输出 `hb,<n>` |\n| 自检 | 3 s 内完成（示例：检查 UART/时钟/一个内存区 CRC），通过后调用 `confirm()` |\n| 看门狗 | IWDG 约 4 s，主循环喂狗；跑飞则复位 → 计入 trial 次数 |\n| `boot` 指令 | 调用 `request_update()`，软复位进 bootloader |\n| `fail` 指令 | 停止喂狗，4 s 后看门狗复位（演示 trial 计次与回滚） |\n| `info` 指令 | 打印当前槽、状态、确认次数 |\n\n两个 Keil target：`app_slot_a`（IROM 0x08008000，`VECT_TAB_OFFSET=0x8000`）、`app_slot_b`（IROM 0x08040000，`VECT_TAB_OFFSET=0x40000`）。\n\n---\n\n## 8. 上位机\n\n`tools/iap_update.py`：\n\n| 命令 | 行为 |\n| --- | --- |\n| `status` | 打印 active/state/两槽版本 |\n| `flash <hex|bin> [--slot auto|a|b] [--baud N]` | 转 bin → 选空闲槽 → START/DATA/END → 校验 → 可选 REBOOT |\n| `confirm` | 手动确认 |\n| `--wait` | 持续 HELLO，配合手动复位 |\n\n---\n\n## 9. 测试与验收\n\n| # | 用例 | 通过标准 |\n| --- | --- | --- |\n| T1 | 烧 bootloader + A 槽应用 | banner 正确，应用正常跑 |\n| T2 | 正常升级 A→B | 传输成功，重启 trial，自检后 CONFIRMED |\n| T3 | 连续升级 20 次 | 全部成功，A/B 正确轮换 |\n| T4 | 升级坏镜像（改 1 字节） | END 报错，旧固件不受影响 |\n| T5 | trial 期间 `fail` 3 次 | 自动回滚旧版本 |\n| T6 | 下载中途断电 | 重启跑旧固件，可重传 |\n| T7 | 921600 升级 | 成功，全程 < 2 s |\n| T8 | 两槽都擦除 | 停留 recovery，可重传恢复 |\n| T9 | 元数据写满整理 | 状态保持，升级继续 |\n| T10 | 连续 50 次升级（压力） | 无失败，日志/擦除行为符合预期 |\n\n验收：T1–T10 全过；bootloader ≤ 16 KB；应用 ≤ 224 KB；启动额外延迟 ≤ 0.5 s。\n\n---\n\n## 10. 里程碑\n\n| # | 交付物 | 责任 |\n| --- | --- | --- |\n| M1 | 本设计文档 v1.1 | 我 |\n| M2 | bootloader 源码 + Keil 工程（已通过编译，7.7 KB）+ 自测 | 我 |\n| M3 | 示例应用（双 target）+ Keil 工程 | 我 |\n| M4 | `tools/iap_update.py` + 离线自测 | 我 |\n| M5 | 测试清单/排错手册/简历材料 | 我 |\n| M6 | 实板 T1–T10 | 你 |\n\n---\n\n## 11. 风险\n\n| # | 风险 | 缓解 |\n| --- | --- | --- |\n| R1 | 400 ms 窗口错过 | `--wait` 持续 HELLO + 手动复位；PE3 强制进入 |\n| R2 | 元数据整理期间掉电 | 概率低；后续加第二 meta 扇区 |\n| R3 | CH340 无 DTR 复位 | 手动复位；应用 `boot` 指令兜底 |\n| R4 | 921600 误码 | 默认 115200，稳定后再升；SET_BAUD 可回退 |\n| R5 | 应用后续超 224 KB | 换 32 KB boot 分区（A 208 KB）或裁剪 |\n\n---\n\n## 12. 待确认\n\n| # | 事项 | 默认 |\n| --- | --- | --- |\n| Q1 | PE3 空闲，可作强制进 bootloader | 可用 |\n| Q2 | 每次上电 400 ms 串口窗口 | 接受 |\n| Q3 | 默认波特率 | 115200（可切 921600） |\n\n---\n\n## 13. 当前状态\n\n| 模块 | 状态 |\n| --- | --- |\n| `bootloader/Src`（flash/meta/crc32/sha256/proto/api/main） | 完成，0 error / 0 warning |\n| `bootloader/MDK/f407_iap_boot.uvprojx` | 由 `tools/gen_boot_project.py` 生成 |\n| `app/` 示例应用 | 完成：`app_slot_a` / `app_slot_b` 各 4280 B；`app_slot_b_bad` 1856 B |\n| `tools/iap_update.py` | 完成：status / flash / confirm / reboot / provision / selftest |\n| `tools/iap_gui.py` | 完成：Tkinter 界面 |\n| `tools/flash_all.ps1` | 完成：ST-Link 首次烧录 |\n| `tools/powerloss_sim.py` | 完成：388 个断点，0 失败 |\n| **实板验证** | **完成**（2026-10-25） |\n\n### 实板实测\n\n```\n首次烧录            bootloader + A 槽 + 元数据      通过\n状态读取            active=A CONFIRMED             通过\nA -> B 升级         4280 B / 1.5 s                通过\n试运行确认          hb 每秒 1 次，3 s 后 CONFIRMED  通过\n坏固件回滚          trial 2/3 -> 3/3 -> boot A     通过\n看门狗              4 s 复位，reset=iwdg            通过\n应用命令进入升级    发送 \"boot\" 后复位              通过\n```\n\n### 调试中修掉的三个真实 bug\n\n| # | 现象 | 根因 | 修复 |\n| --- | --- | --- | --- |\n| 1 | 跳转后应用卡死、tick 不涨 | `jump_to()` 关了中断，应用没重新开 | 跳转前 `__enable_irq()`，应用侧再加一次防御 |\n| 2 | 串口全 0x00 / 无响应 | 工程未定义 `HSE_VALUE`，`SystemCoreClockUpdate()` 按 25 MHz 算出 525 MHz，BRR 错 | 时钟变量显式设为 168 MHz，BRR 按本板实测公式 `84e6/baud` |\n| 3 | bootloader 一进协议就 HardFault | 1 KB 栈被 520 B 帧缓冲 + 调用链撑爆 | 栈改 2 KB，帧缓冲改 static |\n\n### 已知限制\n\n| 限制 | 说明 |\n| --- | --- |\n| 只验证 115200 | 其他波特率代码支持但未实测，上位机已限制为 115200 |\n| BRR 为板级标定 | 公式 `84e6/baud` 在本板实测正确，换晶振/时钟需重算 |\n| 无签名/防回滚 | v1 只做 CRC32 + SHA-256 |\n| 单 meta 扇区 | 整理期间掉电会退一版 |\n\n---\n\n## 14. 变更记录\n\n| 版本 | 日期 | 变更 |\n| --- | --- | --- |\n| v1.0 | 2026-10-25 | 初版（基于手势识别工程 182 KB 应用） |\n| v1.1 | 2026-10-25 | 改为独立项目；应用自研；删除对旧工程的依赖；分区与协议不变 |\n| v1.2 | 2026-10-25 | 示例应用、双 target + 坏固件 target、GUI/CLI 上位机、首次烧录脚本、掉电模拟；补充快速上手指南 |\n| v1.3 | 2026-10-25 | 实板调通：修复中断使能、时钟/BRR、bootloader 栈溢出；完成升级与回滚实测 |\n\n", "docs/IAP_FLOW.md": "# IAP 流程框图（一页看完）\n\n> 配套：[IAP_DESIGN.md](IAP_DESIGN.md)。本文只放图，文字压到最少。\n\n---\n\n## 图 1：谁住在哪（静态）\n\n```\n 0x08000000  +----------------------------+\n             | (2) our bootloader  16 KB  |  <-- reset vector, never erased\n 0x08004000  +----------------------------+\n             |     metadata log    16 KB  |      96 B x 170 records\n 0x08008000  +----------------------------+\n             | (3) app slot A     224 KB  |      link base 0x08008000\n 0x08040000  +----------------------------+\n             | (3) app slot B     256 KB  |      link base 0x08040000\n 0x08080000  +----------------------------+\n\n 0x1FFF0000  +----------------------------+\n             | (1) ST ROM bootloader      |      BOOT0=1 only, rescue\n             +----------------------------+\n```\n\n| # | 谁 | 谁把 CPU 交给它 | 作用 |\n| --- | --- | --- | --- |\n| 1 | ST ROM bootloader | BOOT0=1 的硬件 | 工厂烧录 / 救砖 |\n| 2 | 我们的 bootloader | BOOT0=0 的硬件 | 决策 + 升级 + 跳转 |\n| 3 | 应用 A 或 B | 我们的 bootloader | 干活 |\n\n---\n\n## 图 2：上电到 main 的启动链\n\n```\n power on\n    |\n    v\n [hardware]  MSP = [0x08000000] , PC = [0x08000004]\n    |\n    v\n [startup]   Reset_Handler -> SystemInit (FPU, VTOR) -> __main\n    |\n    v\n [C library] copy .data flash->sram , zero .bss\n    |\n    v\n [main]      your code\n```\n\n---\n\n## 图 3：bootloader 的决策树（核心）\n\n```\n read latest metadata record\n |\n +-- [no record] -----------------> A slot vectors ok ?\n |                                    +-- yes --> run A   (factory state)\n |                                    +-- no  --> RECOVERY (wait UART)\n |\n +-- [TRIAL] ----------------------> image CRC+SHA ok ?\n |                                    +-- no  -------------> ROLLBACK\n |                                    +-- yes --> attempts >= 3 ?\n |                                                 +-- yes --> ROLLBACK\n |                                                 +-- no  --> attempts++ , run slot\n |\n +-- [CONFIRMED] -----------------> run slot\n |\n +-- [BAD] -----------------------> ROLLBACK\n\n then:\n |\n +-- request magic / flag / PE3 pressed ----> UPDATE MODE (UART loop)\n +-- valid frame within 400 ms ------------> UPDATE MODE\n +-- otherwise ----------------------------> jump to active slot\n```\n\nROLLBACK 展开：\n\n```\n rollback(failed_slot)\n   |\n   +-- other slot has a record ? --no--> RECOVERY\n   +-- other image CRC ok ? ------no--> RECOVERY\n   +-- append CONFIRMED(other)\n   +-- jump other\n```\n\n---\n\n## 图 4：一次升级的时序\n\n```\n PC tool                        bootloader                     flash\n   |                                |                            |\n   |--- HELLO --------------------->|                            |\n   |<-- HELLO_ACK (slot,state) -----|                            |\n   |                                |                            |\n   |--- START(ver,size,crc,sha) --->|                            |\n   |                                |--- erase target slot ----->|\n   |<-- START_ACK(slot) ------------|                            |\n   |                                |                            |\n   |--- DATA(offset, 512 B) ------->|--- program 256 B buffer -->|\n   |<-- DATA_ACK(next offset) ------|                            |\n   |            ... repeat ...      |                            |\n   |                                |                            |\n   |--- END(crc, sha) ------------->|--- verify CRC32 + SHA256   |\n   |                                |--- append TRIAL record --->|  (meta sector)\n   |<-- END_ACK(ok) ----------------|                            |\n   |                                |                            |\n   |--- REBOOT -------------------->| reset                      |\n```\n\n关键点：\n\n- START 就擦目标槽（早失败）；\n- 每帧带 offset，可重传；\n- END 才写 TRIAL，校验不过不记账。\n\n---\n\n## 图 5：TRIAL / CONFIRMED / ROLLBACK 状态机\n\n```\n                     download + verify ok\n   CONFIRMED(A) -----------------------------> TRIAL(B)\n        ^                                        |\n        |                                        | boot: attempts++\n        |                                        v\n        |                                 +--------------+\n        |                                 | app selftest |\n        |                                 +------+-------+\n        |                              pass      | crash (IWDG)\n        |                                        | or 3rd boot\n        |                                        v\n        |                                  +-----------+\n        |                                  | ROLLBACK  |\n        |                                  +-----+-----+\n        |                                        |\n        +----------------------------------------+\n                   append CONFIRMED(A)\n```\n\n时间关系：\n\n```\n boot            0 s          3 s                 4 s\n  |---------------|------------|-------------------|\n  bootloader      app selftest  confirm()          IWDG timeout\n                                 (if pass)          (if hang)\n```\n\n---\n\n## 图 6：跳转到底改了什么\n\n```\n        bootloader state                  application state\n   +------------------------+        +------------------------+\n   | MSP   = boot stack     |        | MSP   = [slot base]    |\n   | VTOR  = 0x08000000     |        | VTOR  = slot base      |\n   | PC    = jump_to()      |        | PC    = [slot base+4]  |\n   | SysTick ON, IRQ ON     |        | SysTick OFF, IRQ OFF   |\n   +-----------+------------+        +-----------^------------+\n               |                                 |\n               |  SCB->VTOR = base               |\n               |  __set_MSP([base])              |\n               |  branch [base+4]                |\n               +---------------------------------+\n```\n\n跳过去后，应用的 `Reset_Handler` 会再走一遍图 2 的启动链。\n\n---\n\n## 图 7：断电发生在哪一步，结果是什么\n\n```\n phase            flash after power loss        next boot\n ---------------  ----------------------------  ---------------------\n before START     unchanged                     old slot\n during erase     target slot blank             old slot\n during DATA      target partial                old slot\n after END check  target complete, no record    old slot\n after TRIAL      record -> new slot            new slot, attempts=1\n after CONFIRM    record -> new slot, confirmed new slot, no count\n during rollback  record -> old slot            old slot\n```\n\n不变量：\n\n```\n every moment:  (old slot intact)  OR  (last valid record intact)\n```\n\n---\n\n## 图 8：四个升级入口\n\n```\n                     +---------------------+\n   app request ----->|                     |\n   meta flag ------->|    UPDATE MODE      |---> HELLO/START/DATA/END\n   PE3 button ------>|  (never returns    |\n   400 ms window --->|   until reboot)     |\n                     +---------------------+\n```\n\n---\n\n## 图 9：两个工程如何产出三个固件\n\n```\n bootloader/Src ----[f407_iap_boot.uvprojx]----> f407_iap_boot.hex  -> 0x08000000\n app/Src ----------+--[app_slot_a]--------------> app_slot_a.hex    -> 0x08008000\n                   +--[app_slot_b]--------------> app_slot_b.hex    -> 0x08040000\n```\n"};
const list = document.getElementById('list');
const title = document.getElementById('title');
const code = document.getElementById('code');
let current = null;

function esc(s) { return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function highlight(src) {
  let s = esc(src);
  s = s.replace(/(\/\/[^\n]*|\/\*[\s\S]*?\*\/|#[^\n]*)/g, '<span class="com">$1</span>');
  s = s.replace(/(&quot;[^&]*?&quot;|'[^']*?')/g, '<span class="str">$1</span>');
  s = s.replace(/\b(0x[0-9a-fA-F]+|\d+)\b/g, '<span class="num">$1</span>');
  s = s.replace(/\b(static|const|volatile|uint8_t|uint16_t|uint32_t|int|void|if|else|for|while|return|struct|typedef|break|continue|switch|case|default|sizeof)\b/g, '<span class="kw">$1</span>');
  return s;
}

function show(name) {
  current = name;
  title.textContent = name + '    (' + FILES[name].split('\n').length + ' 行)';
  code.innerHTML = highlight(FILES[name]);
  [...document.querySelectorAll('.file')].forEach(e => e.classList.toggle('active', e.dataset.name === name));
}

function render(filter) {
  list.innerHTML = '';
  let lastDir = '';
  Object.keys(FILES).forEach(name => {
    if (filter && !name.toLowerCase().includes(filter.toLowerCase())) return;
    const dir = name.includes('/') ? name.slice(0, name.lastIndexOf('/')) : '';
    if (dir !== lastDir) {
      const d = document.createElement('div');
      d.className = 'dir'; d.textContent = dir || '(根目录)';
      list.appendChild(d); lastDir = dir;
    }
    const e = document.createElement('div');
    e.className = 'file'; e.textContent = name.split('/').pop();
    e.dataset.name = name; e.title = name;
    e.onclick = () => show(name);
    list.appendChild(e);
  });
}

render('');
document.getElementById('filter').oninput = e => render(e.target.value);
show(Object.keys(FILES)[0]);
</script>
</body></html>
