<script>
const FILES = {"bootloader/Inc/ab_api.h": "/**\n * @file  ab_api.h\n * @brief API the bootloader publishes for the running application.\n *\n * The table lives in CCM at AB_API_ADDR and is refreshed before every jump.\n * The application must check `magic` before calling anything.\n */\n#ifndef AB_API_H\n#define AB_API_H\n\n#include \"ab_config.h\"\n\nvoid ab_api_publish(void);\n\n#endif /* AB_API_H */\n", "bootloader/Inc/ab_config.h": "/**\n * @file    ab_config.h\n * @brief   A/B bootloader + serial IAP: flash map, metadata record, public API.\n *\n * Layout for STM32F407VE (512 KB flash, sectors 16/16/16/16/64/128/128/128 KB):\n *\n *   0x08000000  sector 0   16 KB   bootloader\n *   0x08004000  sector 1   16 KB   metadata log (append only)\n *   0x08008000  sector 2-5 224 KB  slot A  (16 + 16 + 64 + 128)\n *   0x08040000  sector 6-7 256 KB  slot B  (128 + 128)\n *\n * Both slots hold a raw application image: vector table first, no header.\n * The metadata log is the single source of truth (slot + version + CRC + SHA).\n */\n#ifndef AB_CONFIG_H\n#define AB_CONFIG_H\n\n#include <stdint.h>\n\n/* ------------------------------------------------------------------ flash */\n#define AB_FLASH_BASE       0x08000000u\n#define AB_BOOT_ADDR        0x08000000u\n#define AB_BOOT_SIZE        0x00004000u   /* sector 0, 16 KB */\n\n#define AB_META_ADDR        0x08004000u   /* sector 1, 16 KB */\n#define AB_META_SIZE        0x00004000u\n\n#define AB_SLOT_A_ADDR      0x08008000u\n#define AB_SLOT_A_SIZE      0x00038000u   /* 224 KB */\n#define AB_SLOT_B_ADDR      0x08040000u\n#define AB_SLOT_B_SIZE      0x00040000u   /* 256 KB */\n\n/* Largest image accepted by either slot. */\n#define AB_IMAGE_MAX        AB_SLOT_A_SIZE\n\n/* ---------------------------------------------------------------- records */\n#define AB_META_MAGIC       0x41424946u   /* \"ABIF\" */\n#define AB_REC_SIZE         96u\n#define AB_META_SLOTS_MAX   (AB_META_SIZE / AB_REC_SIZE)   /* 170 */\n\n/* Record states. */\n#define AB_ST_NONE          0u\n#define AB_ST_TRIAL         1u\n#define AB_ST_CONFIRMED     2u\n#define AB_ST_BAD           3u\n\n/* Record flags. */\n#define AB_FLAG_UPDATE_REQ  0x0001u\n\n/* Attempts allowed before a trial image is rolled back. */\n#define AB_MAX_ATTEMPTS     3u\n\n/* --------------------------------------------------- cross-reset handshake */\n/* CCM RAM is used because the application leaves it untouched.  Keep the\n * top 512 bytes of CCM reserved for the bootloader. */\n#define AB_API_ADDR         0x1000FF00u\n#define AB_REQ_ADDR         0x1000FE00u\n#define AB_REQ_MAGIC        0xB00710ADu\n#define AB_API_MAGIC        0x41424950u   /* \"ABIP\" */\n#define AB_API_VERSION      2u\n\n/* --------------------------------------------------------------- protocol */\n#define AB_PROTO_VERSION    1u\n#define AB_SYNC0            0xAAu\n#define AB_SYNC1            0x55u\n#define AB_MAX_PAYLOAD      512u\n#define AB_DEFAULT_BAUD     115200u\n\n/* Request types (response = type | 0x80). */\n#define AB_CMD_HELLO        0x01u\n#define AB_CMD_START        0x02u\n#define AB_CMD_DATA         0x03u\n#define AB_CMD_END          0x04u\n#define AB_CMD_STATUS       0x05u\n#define AB_CMD_CONFIRM      0x06u\n#define AB_CMD_REBOOT       0x07u\n#define AB_CMD_SET_BAUD     0x08u\n#define AB_CMD_ABORT        0x09u\n#define AB_RSP_BIT          0x80u\n\n/* Status codes carried in response payloads. */\n#define AB_OK               0x00u\n#define AB_ERR_CRC          0x01u\n#define AB_ERR_LEN          0x02u\n#define AB_ERR_STATE        0x03u\n#define AB_ERR_SIZE         0x04u\n#define AB_ERR_FLASH        0x05u\n#define AB_ERR_VERIFY       0x06u\n#define AB_ERR_VERSION      0x07u\n\n/* ---------------------------------------------------------------- utility */\n#define AB_SLOT_A           0u\n#define AB_SLOT_B           1u\n#define AB_SLOT_NONE        0xFFu\n\nstatic inline uint32_t ab_slot_base(uint8_t slot)\n{\n    return (slot == AB_SLOT_B) ? AB_SLOT_B_ADDR : AB_SLOT_A_ADDR;\n}\n\nstatic inline uint32_t ab_slot_size(uint8_t slot)\n{\n    return (slot == AB_SLOT_B) ? AB_SLOT_B_SIZE : AB_SLOT_A_SIZE;\n}\n\nstatic inline uint8_t ab_slot_other(uint8_t slot)\n{\n    return (slot == AB_SLOT_B) ? AB_SLOT_A : AB_SLOT_B;\n}\n\n/* Metadata record, 96 bytes, append-only. */\ntypedef struct __attribute__((packed)) {\n    uint32_t magic;\n    uint16_t rec_size;\n    uint8_t  slot;          /* 0 = A, 1 = B */\n    uint8_t  state;         /* AB_ST_* */\n    uint32_t seq;           /* strictly increasing */\n    uint32_t version;       /* 0xMMmmppbb */\n    uint32_t img_size;\n    uint32_t img_crc32;\n    uint16_t attempts;\n    uint16_t flags;\n    uint8_t  sha256[32];\n    uint32_t crc32;         /* over bytes [0 .. 64) */\n    uint8_t  reserved[32];\n} ab_meta_rec_t;\n\n/* API published by the bootloader in CCM before every jump. */\ntypedef struct {\n    uint32_t magic;\n    uint32_t version;\n    uint32_t (*confirm)(void);          /* mark running trial image good */\n    uint32_t (*state)(void);            /* AB_ST_* of the running slot */\n    uint32_t (*active_slot)(void);\n    uint32_t (*request_update)(void);   /* set boot-request magic + reset */\n    uint32_t (*running_version)(void);  /* version of the active slot */\n} ab_api_t;\n\n#endif /* AB_CONFIG_H */\n", "bootloader/Inc/ab_flash.h": "/**\n * @file  ab_flash.h\n * @brief STM32F4 internal flash driver (register level, no HAL).\n */\n#ifndef AB_FLASH_H\n#define AB_FLASH_H\n\n#include <stdint.h>\n\n#define AB_FLASH_OK         0\n#define AB_FLASH_ERR        (-1)\n\nuint32_t ab_flash_sector_of(uint32_t addr);\nint ab_flash_erase_sector(uint32_t sector);\nint ab_flash_erase_range(uint32_t addr, uint32_t len);\nint ab_flash_program(uint32_t addr, const void *data, uint32_t len);\nint ab_flash_blank(uint32_t addr, uint32_t len);\n\n#endif /* AB_FLASH_H */\n", "bootloader/Inc/ab_image.h": "/**\n * @file  ab_image.h\n * @brief Boot-time image sanity checks.\n */\n#ifndef AB_IMAGE_H\n#define AB_IMAGE_H\n\n#include \"ab_config.h\"\n\n/* Full check: vector table sanity + CRC32, optionally SHA-256. */\nint ab_image_verify(const ab_meta_rec_t *rec, int full_sha);\n\n/* Cheap check used when no metadata exists yet. */\nint ab_image_vectors_ok(uint8_t slot);\n\n#endif /* AB_IMAGE_H */\n", "bootloader/Inc/ab_meta.h": "/**\n * @file  ab_meta.h\n * @brief Append-only metadata log: slot, version, CRC32, SHA-256, state.\n *\n * One 96-byte record per event.  A record is valid only if magic and its own\n * CRC32 are correct, so a power loss while writing simply leaves a torn record\n * that is ignored and later overwritten by a compaction.\n */\n#ifndef AB_META_H\n#define AB_META_H\n\n#include \"ab_config.h\"\n\n/* Load the newest valid record.  Returns 1 when found, 0 when the log is empty. */\nint ab_meta_load(ab_meta_rec_t *latest);\n\n/* Newest record for a given slot.  Returns 1 when found. */\nint ab_meta_find(uint8_t slot, ab_meta_rec_t *out);\n\n/* Append one record (seq/CRC filled in).  allow_compact lets the caller erase\n * the sector when the log is full or torn; only the bootloader should pass 1. */\nint ab_meta_append(ab_meta_rec_t *rec, int allow_compact);\n\n/* Erase the log and keep `latest` as the only record. */\nint ab_meta_compact(const ab_meta_rec_t *latest);\n\n/* Number of records still writable before a compaction is required. */\nuint32_t ab_meta_free_records(void);\n\n#endif /* AB_META_H */\n", "bootloader/Inc/ab_proto.h": "/**\n * @file  ab_proto.h\n * @brief Binary UART update protocol.\n */\n#ifndef AB_PROTO_H\n#define AB_PROTO_H\n\n#include <stdint.h>\n\n/* Handle one frame if it arrives inside the window.  Returns 1 when the\n * bootloader should stay in update mode (a HELLO was received). */\nint ab_proto_listen(uint32_t window_ms);\n\n/* Update loop; never returns in normal operation (resets on idle timeout). */\nvoid ab_proto_run(void);\n\n#endif /* AB_PROTO_H */\n", "bootloader/Inc/ab_uart.h": "/**\n * @file  ab_uart.h\n * @brief USART1 (PA9/PA10) polling driver plus 1 ms time base.\n */\n#ifndef AB_UART_H\n#define AB_UART_H\n\n#include <stdint.h>\n\nvoid ab_clock_init(void);\nvoid ab_time_init(void);\nuint32_t ab_millis(void);\nvoid ab_delay_ms(uint32_t ms);\n\nvoid ab_uart_init(uint32_t baud);\nvoid ab_uart_putc(uint8_t c);\nvoid ab_uart_write(const void *data, uint32_t len);\nvoid ab_uart_write_str(const char *s);\nint  ab_uart_getc(uint8_t *c, uint32_t timeout_ms);\nvoid ab_uart_rx_flush(void);\n\n#endif /* AB_UART_H */\n", "bootloader/Inc/ab_util.h": "/**\n * @file  ab_util.h\n * @brief CRC32 (IEEE 802.3) and SHA-256, dependency free.\n */\n#ifndef AB_UTIL_H\n#define AB_UTIL_H\n\n#include <stdint.h>\n\n/* CRC32: start with 0xFFFFFFFF, xor the result with 0xFFFFFFFF at the end. */\nuint32_t ab_crc32_start(void);\nuint32_t ab_crc32_update(uint32_t crc, const void *data, uint32_t len);\nuint32_t ab_crc32_final(uint32_t crc);\nuint32_t ab_crc32(const void *data, uint32_t len);\n\ntypedef struct {\n    uint32_t h[8];\n    uint64_t total;\n    uint8_t  buf[64];\n    uint32_t used;\n} ab_sha256_ctx;\n\nvoid ab_sha256_init(ab_sha256_ctx *ctx);\nvoid ab_sha256_update(ab_sha256_ctx *ctx, const void *data, uint32_t len);\nvoid ab_sha256_final(ab_sha256_ctx *ctx, uint8_t out[32]);\nvoid ab_sha256(const void *data, uint32_t len, uint8_t out[32]);\n\n#endif /* AB_UTIL_H */\n", "bootloader/Src/ab_api.c": "/**\n * @file  ab_api.c\n * @brief Implementation of the confirm/state/request API.\n *\n * These functions execute from bootloader flash while the application runs.\n * Only appends are allowed here: an erase would stall the CPU for ~250 ms and\n * could trip the application's watchdog, so compaction stays in the boot path.\n */\n#include \"ab_api.h\"\n#include \"ab_meta.h\"\n#include \"stm32f4xx.h\"\n\nstatic uint32_t api_confirm(void)\n{\n    ab_meta_rec_t latest;\n    uint32_t primask = __get_PRIMASK();\n\n    __disable_irq();\n    if (ab_meta_load(&latest) && latest.state == AB_ST_TRIAL) {\n        latest.state = AB_ST_CONFIRMED;\n        latest.attempts = 0u;\n        latest.flags = 0u;\n        if (ab_meta_append(&latest, 0) != 0) {\n            __set_PRIMASK(primask);\n            return 1u;\n        }\n    }\n    __set_PRIMASK(primask);\n    return 0u;\n}\n\nstatic uint32_t api_state(void)\n{\n    ab_meta_rec_t latest;\n\n    if (ab_meta_load(&latest)) {\n        return latest.state;\n    }\n    return AB_ST_NONE;\n}\n\nstatic uint32_t api_active_slot(void)\n{\n    ab_meta_rec_t latest;\n\n    if (ab_meta_load(&latest)) {\n        return latest.slot;\n    }\n    return AB_SLOT_A;\n}\n\nstatic uint32_t api_running_version(void)\n{\n    ab_meta_rec_t latest;\n\n    if (ab_meta_load(&latest)) {\n        return latest.version;\n    }\n    return 0u;\n}\n\nstatic uint32_t api_request_update(void)\n{\n    *(volatile uint32_t *)(uintptr_t)AB_REQ_ADDR = AB_REQ_MAGIC;\n    __DSB();\n    NVIC_SystemReset();\n    return 0u;\n}\n\nvoid ab_api_publish(void)\n{\n    ab_api_t *api = (ab_api_t *)(uintptr_t)AB_API_ADDR;\n\n    api->magic = 0u;\n    api->version = AB_API_VERSION;\n    api->confirm = api_confirm;\n    api->state = api_state;\n    api->active_slot = api_active_slot;\n    api->request_update = api_request_update;\n    api->running_version = api_running_version;\n    __DSB();\n    __ISB();\n    api->magic = AB_API_MAGIC;\n    __DSB();\n}\n", "bootloader/Src/ab_flash.c": "/**\n * @file  ab_flash.c\n * @brief STM32F407 flash: 16/16/16/16/64/128/128/128 KB sectors, x32 programming.\n */\n#include \"ab_flash.h\"\n#include \"ab_config.h\"\n#include \"stm32f4xx.h\"\n\n#define FLASH_TIMEOUT   0xFFFFFFFFu\n\nstatic int flash_wait(void)\n{\n    uint32_t guard = FLASH_TIMEOUT;\n\n    while ((FLASH->SR & FLASH_SR_BSY) != 0u) {\n        if (--guard == 0u) {\n            return AB_FLASH_ERR;\n        }\n    }\n    return AB_FLASH_OK;\n}\n\nstatic void flash_clear_flags(void)\n{\n    FLASH->SR = FLASH_SR_EOP | FLASH_SR_OPERR | FLASH_SR_WRPERR |\n                FLASH_SR_PGAERR | FLASH_SR_PGPERR | FLASH_SR_PGSERR;\n}\n\nstatic int flash_has_error(void)\n{\n    return (FLASH->SR & (FLASH_SR_OPERR | FLASH_SR_WRPERR | FLASH_SR_PGAERR |\n                         FLASH_SR_PGPERR | FLASH_SR_PGSERR)) != 0u;\n}\n\nstatic void flash_unlock(void)\n{\n    if ((FLASH->CR & FLASH_CR_LOCK) != 0u) {\n        FLASH->KEYR = 0x45670123u;\n        FLASH->KEYR = 0xCDEF89ABu;\n    }\n}\n\nstatic void flash_lock(void)\n{\n    FLASH->CR |= FLASH_CR_LOCK;\n}\n\nuint32_t ab_flash_sector_of(uint32_t addr)\n{\n    if (addr < 0x08004000u) return 0u;\n    if (addr < 0x08008000u) return 1u;\n    if (addr < 0x0800C000u) return 2u;\n    if (addr < 0x08010000u) return 3u;\n    if (addr < 0x08020000u) return 4u;\n    if (addr < 0x08040000u) return 5u;\n    if (addr < 0x08060000u) return 6u;\n    return 7u;\n}\n\nint ab_flash_erase_sector(uint32_t sector)\n{\n    int rc;\n\n    if (sector > 7u) {\n        return AB_FLASH_ERR;\n    }\n\n    flash_unlock();\n    flash_wait();\n    flash_clear_flags();\n\n    FLASH->CR = FLASH_CR_SER | FLASH_CR_PSIZE_1 | (sector << FLASH_CR_SNB_Pos);\n    FLASH->CR |= FLASH_CR_STRT;\n\n    rc = flash_wait();\n    FLASH->CR &= ~(FLASH_CR_SER | FLASH_CR_STRT);\n    if (flash_has_error()) {\n        rc = AB_FLASH_ERR;\n    }\n    flash_clear_flags();\n    flash_lock();\n\n    return rc;\n}\n\nint ab_flash_erase_range(uint32_t addr, uint32_t len)\n{\n    uint32_t first;\n    uint32_t last;\n    uint32_t s;\n\n    if (len == 0u) {\n        return AB_FLASH_OK;\n    }\n    if (addr < AB_FLASH_BASE || (addr + len) > (AB_FLASH_BASE + 0x00080000u)) {\n        return AB_FLASH_ERR;\n    }\n\n    first = ab_flash_sector_of(addr);\n    last  = ab_flash_sector_of(addr + len - 1u);\n\n    for (s = first; s <= last; s++) {\n        if (ab_flash_erase_sector(s) != AB_FLASH_OK) {\n            return AB_FLASH_ERR;\n        }\n    }\n    return AB_FLASH_OK;\n}\n\nint ab_flash_program(uint32_t addr, const void *data, uint32_t len)\n{\n    const uint32_t *src = (const uint32_t *)data;\n    uint32_t words = len / 4u;\n    uint32_t i;\n    int rc = AB_FLASH_OK;\n\n    if (addr < AB_FLASH_BASE || (len & 3u) != 0u) {\n        return AB_FLASH_ERR;\n    }\n\n    flash_unlock();\n    flash_wait();\n    flash_clear_flags();\n\n    FLASH->CR = FLASH_CR_PG | FLASH_CR_PSIZE_1;\n\n    for (i = 0; i < words; i++) {\n        if (flash_wait() != AB_FLASH_OK) {\n            rc = AB_FLASH_ERR;\n            break;\n        }\n        if (flash_has_error()) {\n            rc = AB_FLASH_ERR;\n            break;\n        }\n        *(volatile uint32_t *)(addr + i * 4u) = src[i];\n    }\n\n    if (flash_wait() != AB_FLASH_OK) {\n        rc = AB_FLASH_ERR;\n    }\n    if (flash_has_error()) {\n        rc = AB_FLASH_ERR;\n    }\n\n    FLASH->CR &= ~FLASH_CR_PG;\n    flash_clear_flags();\n    flash_lock();\n\n    return rc;\n}\n\nint ab_flash_blank(uint32_t addr, uint32_t len)\n{\n    const uint32_t *p = (const uint32_t *)addr;\n    uint32_t words = len / 4u;\n    uint32_t i;\n\n    for (i = 0; i < words; i++) {\n        if (p[i] != 0xFFFFFFFFu) {\n            return 0;\n        }\n    }\n    return 1;\n}\n", "bootloader/Src/ab_image.c": "/**\n * @file  ab_image.c\n * @brief Validate an application image inside a slot.\n */\n#include \"ab_image.h\"\n#include \"ab_util.h\"\n\n#define AB_SRAM_START   0x20000000u\n#define AB_SRAM_END     0x20020000u\n\nint ab_image_vectors_ok(uint8_t slot)\n{\n    uint32_t base = ab_slot_base(slot);\n    uint32_t size = ab_slot_size(slot);\n    uint32_t sp = *(const volatile uint32_t *)(uintptr_t)base;\n    uint32_t rv = *(const volatile uint32_t *)(uintptr_t)(base + 4u);\n\n    if (sp < AB_SRAM_START || sp > AB_SRAM_END || (sp & 3u) != 0u) {\n        return 0;\n    }\n    if ((rv & 1u) == 0u) {\n        return 0;\n    }\n    rv &= ~1u;\n    if (rv < base || rv >= (base + size)) {\n        return 0;\n    }\n    return 1;\n}\n\nint ab_image_verify(const ab_meta_rec_t *rec, int full_sha)\n{\n    uint32_t base;\n    uint32_t size;\n    uint32_t crc;\n    uint8_t sha[32];\n    uint32_t i;\n\n    if (rec->slot > AB_SLOT_B) {\n        return 0;\n    }\n    base = ab_slot_base(rec->slot);\n    size = rec->img_size;\n\n    if (size < 8u || size > ab_slot_size(rec->slot) || size > AB_IMAGE_MAX) {\n        return 0;\n    }\n    if (!ab_image_vectors_ok(rec->slot)) {\n        return 0;\n    }\n\n    crc = ab_crc32((const void *)(uintptr_t)base, size);\n    if (crc != rec->img_crc32) {\n        return 0;\n    }\n\n    if (full_sha) {\n        ab_sha256((const void *)(uintptr_t)base, size, sha);\n        for (i = 0; i < 32u; i++) {\n            if (sha[i] != rec->sha256[i]) {\n                return 0;\n            }\n        }\n    }\n    return 1;\n}\n", "bootloader/Src/ab_meta.c": "/**\n * @file  ab_meta.c\n * @brief Append-only metadata log with torn-write tolerance.\n */\n#include \"ab_meta.h\"\n#include \"ab_flash.h\"\n#include \"ab_util.h\"\n#include <stddef.h>\n#include <string.h>\n\n#define REC_CRC_LEN   offsetof(ab_meta_rec_t, crc32)\n\ntypedef char ab_meta_size_check[(sizeof(ab_meta_rec_t) == AB_REC_SIZE) ? 1 : -1];\n\nstatic const ab_meta_rec_t *rec_at(uint32_t offset)\n{\n    return (const ab_meta_rec_t *)(uintptr_t)(AB_META_ADDR + offset);\n}\n\nstatic int rec_valid(const ab_meta_rec_t *r)\n{\n    if (r->magic != AB_META_MAGIC || r->rec_size != AB_REC_SIZE) {\n        return 0;\n    }\n    return r->crc32 == ab_crc32(r, (uint32_t)REC_CRC_LEN);\n}\n\n/**\n * Walk the log from the start.\n * @param latest   newest valid record (may be untouched when empty)\n * @param next_off offset of the first non-record (append position)\n * @param torn     set when a written-but-invalid record was met\n * @return 1 when at least one valid record exists\n */\nstatic int meta_walk(ab_meta_rec_t *latest, uint32_t *next_off, int *torn)\n{\n    uint32_t off = 0u;\n    uint32_t last_seq = 0u;\n    int have = 0;\n\n    *torn = 0;\n\n    while ((off + AB_REC_SIZE) <= AB_META_SIZE) {\n        const ab_meta_rec_t *r = rec_at(off);\n\n        if (r->magic == 0xFFFFFFFFu) {\n            break;\n        }\n        if (!rec_valid(r)) {\n            *torn = 1;\n            break;\n        }\n        if (!have || r->seq > last_seq) {\n            *latest = *r;\n            last_seq = r->seq;\n            have = 1;\n        }\n        off += AB_REC_SIZE;\n    }\n\n    *next_off = off;\n    return have;\n}\n\nint ab_meta_load(ab_meta_rec_t *latest)\n{\n    uint32_t next;\n    int torn;\n\n    return meta_walk(latest, &next, &torn);\n}\n\nint ab_meta_find(uint8_t slot, ab_meta_rec_t *out)\n{\n    uint32_t off = 0u;\n    uint32_t best_seq = 0u;\n    int found = 0;\n\n    while ((off + AB_REC_SIZE) <= AB_META_SIZE) {\n        const ab_meta_rec_t *r = rec_at(off);\n\n        if (r->magic == 0xFFFFFFFFu) {\n            break;\n        }\n        if (!rec_valid(r)) {\n            break;\n        }\n        if (r->slot == slot && (!found || r->seq > best_seq)) {\n            *out = *r;\n            best_seq = r->seq;\n            found = 1;\n        }\n        off += AB_REC_SIZE;\n    }\n    return found;\n}\n\nint ab_meta_compact(const ab_meta_rec_t *latest)\n{\n    if (ab_flash_erase_sector(1u) != AB_FLASH_OK) {\n        return -1;\n    }\n    if (latest != NULL) {\n        ab_meta_rec_t rec = *latest;\n\n        rec.seq += 1u;\n        rec.crc32 = ab_crc32(&rec, (uint32_t)REC_CRC_LEN);\n        if (ab_flash_program(AB_META_ADDR, &rec, AB_REC_SIZE) != AB_FLASH_OK) {\n            return -1;\n        }\n    }\n    return 0;\n}\n\nint ab_meta_append(ab_meta_rec_t *rec, int allow_compact)\n{\n    ab_meta_rec_t latest;\n    ab_meta_rec_t verify;\n    uint32_t next;\n    uint32_t seq;\n    int torn;\n    int have = meta_walk(&latest, &next, &torn);\n\n    if (torn || (next + AB_REC_SIZE) > AB_META_SIZE) {\n        if (!allow_compact) {\n            return -1;\n        }\n        if (ab_meta_compact(have ? &latest : NULL) != 0) {\n            return -1;\n        }\n        next .slot;\n    wr32(&out[2], s_dl.version);\n    reply(f, out, 6u);\n}\n\nstatic void cmd_status(const ab_frame_t *f)\n{\n    uint8_t out[4 + 12 * 2];\n    ab_meta_rec_t latest;\n    ab_meta_rec_t rec;\n    uint8_t active = AB_SLOT_A;\n    uint8_t state = AB_ST_NONE;\n    uint8_t count = 0u;\n    uint8_t slot;\n\n    memset(out, 0, sizeof(out));\n    if (ab_meta_load(&latest)) {\n        active = latest.slot;\n        state = latest.state;\n    }\n    out[0] = AB_OK;\n    out[1] = active;\n    out[2] = state;\n\n    for (slot = 0u; slot <= 1u; slot++) {\n        uint8_t *p = &out[4u + slot * 12u];\n        if (ab_meta_find(slot, &rec)) {\n            p[0] = 1u;\n            p[1] = rec.state;\n            p[2] = (uint8_t)(rec.attempts > 255u ? 255u : rec.attempts);\n            p[3] = 0u;\n            wr32(&p[4], rec.version);\n            wr32(&p[8], rec.img_size);\n            count++;\n        }\n    }\n    out[3] = count;\n\n    reply(f, out, (uint16_t)sizeof(out));\n}\n\nstatic void cmd_confirm(const ab_frame_t *f)\n{\n    ab_meta_rec_t latest;\n\n    if (!ab_meta_load(&latest) || latest.state != AB_ST_TRIAL) {\n        reply_status(f, AB_ERR_STATE);\n        return;\n    }\n    latest.state = AB_ST_CONFIRMED;\n    latest.attempts = 0u;\n    latest.flags = 0u;\n    if (ab_meta_append(&latest, 1) != 0) {\n        reply_status(f, AB_ERR_FLASH);\n        return;\n    }\n    reply_status(f, AB_OK);\n}\n\nstatic void cmd_set_baud(const ab_frame_t *f)\n{\n    uint32_t baud;\n\n    if (f->len < 4u) {\n        reply_status(f, AB_ERR_LEN);\n        return;\n    }\n    baud = rd32(&f->payload[0]);\n    if (baud != 115200u && baud != 230400u && baud != 460800u && baud != 921600u) {\n        reply_status(f, AB_ERR_LEN);\n        return;\n    }\n    reply_status(f, AB_OK);\n    ab_delay_ms(10u);\n    ab_uart_init(baud);\n    ab_uart_rx_flush();\n}\n\nstatic void cmd_reboot(const ab_frame_t *f)\n{\n    reply_status(f, AB_OK);\n    ab_delay_ms(20u);\n    NVIC_SystemReset();\n}\n\nstatic void dispatch(const ab_frame_t *f)\n{\n    switch (f->type) {\n    case AB_CMD_HELLO:   cmd_hello(f);   break;\n    case AB_CMD_START:   cmd_start(f);   break;\n    case AB_CMD_DATA:    cmd_data(f);    break;\n    case AB_CMD_END:     cmd_end(f);     break;\n    case AB_CMD_STATUS:  cmd_status(f);  break;\n    case AB_CMD_CONFIRM: cmd_confirm(f); break;\n    case AB_CMD_SET_BAUD: cmd_set_baud(f); break;\n    case AB_CMD_REBOOT:  cmd_reboot(f);  break;\n    case AB_CMD_ABORT:\n        s_dl.active = 0u;\n        reply_status(f, AB_OK);\n        break;\n    default:\n        reply_status(f, AB_ERR_STATE);\n        break;\n    }\n}\n\n/* ------------------------------------------------------------------ loops */\nint ab_proto_listen(uint32_t window_ms)\n{\n    uint32_t start = ab_millis();\n\n    for (;;) {\n        uint32_t elapsed = ab_millis() - start;\n        static ab_frame_t f;\n        int rc;\n\n        if (elapsed >= window_ms) {\n            return 0;\n        }\n        rc = recv_frame(&f, window_ms - elapsed);\n        if (rc == 0) {\n            return 0;\n        }\n        if (rc < 0) {\n            continue;\n        }\n        dispatch(&f);\n        return 1;\n    }\n}\n\nvoid ab_proto_run(void)\n{\n    uint32_t last = ab_millis();\n\n    for (;;) {\n        static ab_frame_t f;\n        int rc = recv_frame(&f, 1000u);\n\n        if (rc > 0) {\n            dispatch(&f);\n            last = ab_millis();\n        } else if (s_dl.active == 0u && (ab_millis() - last) > AB_IDLE_RESET_MS) {\n            NVIC_SystemReset();\n        }\n    }\n}\n", "bootloader/Src/ab_uart.c": "/**\n * @file  ab_uart.c\n * @brief USART1 polling driver, HSI 16 MHz clock tree.\n */\n#include \"ab_uart.h\"\n#include \"stm32f4xx.h\"\n\nstatic volatile uint32_t s_ticks;\n\nvoid SysTick_Handler(void)\n{\n    s_ticks++;\n}\n\n/* 168 MHz from HSE 8 MHz, same tree as the original application firmware.\n * Falls back to HSI 16 MHz / PLL if the crystal does not start. */\nvoid ab_clock_init(void)\n{\n    uint32_t pllcfgr;\n    uint32_t guard;\n\n    RCC->CR |= RCC_CR_HSEON;\n    for (guard = 0; guard < 200000u; guard++) {\n        if ((RCC->CR & RCC_CR_HSERDY) != 0u) {\n            break;\n        }\n    }\n\n    if ((RCC->CR & RCC_CR_HSERDY) != 0u) {\n        pllcfgr = (8u << 0) | (336u << 6) | (0u << 16) |\n                  RCC_PLLCFGR_PLLSRC_HSE | (7u << 24);\n    } else {\n        pllcfgr = (16u << 0) | (336u << 6) | (0u << 16) | (7u << 24);\n    }\n\n    RCC->PLLCFGR = pllcfgr;\n    RCC->CR |= RCC_CR_PLLON;\n    while ((RCC->CR & RCC_CR_PLLRDY) == 0u) {\n    }\n\n    FLASH->ACR = FLASH_ACR_LATENCY_5WS | FLASH_ACR_PRFTEN |\n                 FLASH_ACR_ICEN | FLASH_ACR_DCEN;\n\n    RCC->CFGR = RCC_CFGR_HPRE_DIV1 | RCC_CFGR_PPRE1_DIV4 |\n                RCC_CFGR_PPRE2_DIV2 | RCC_CFGR_SW_PLL;\n    while ((RCC->CFGR & RCC_CFGR_SWS) != RCC_CFGR_SWS_PLL) {\n    }\n\n    /* Do not call SystemCoreClockUpdate(): this project does not define\n     * HSE_VALUE, so CMSIS assumes 25 MHz and reports 525 MHz here. */\n    SystemCoreClock = 168000000u;\n}\n\nvoid ab_time_init(void)\n{\n    /* 1 ms tick, lowest priority. */\n    (void)SysTick_Config(SystemCoreClock / 1000u);\n}\n\nuint32_t ab_millis(void)\n{\n    return s_ticks;\n}\n\nvoid ab_delay_ms(uint32_t ms)\n{\n    uint32_t start = ab_millis();\n\n    while ((ab_millis() - start) < ms) {\n        __NOP();\n    }\n}\n\nvoid ab_uart_init(uint32_t baud)\n{\n\n\n    RCC->AHB1ENR |= RCC_AHB1ENR_GPIOAEN;\n    RCC->APB2ENR |= RCC_APB2ENR_USART1EN;\n\n    /* PA9 = TX, PA10 = RX, alternate function 7. */\n    GPIOA->MODER = (GPIOA->MODER & ~((3u << 18) | (3u << 20))) |\n                   (2u << 18) | (2u << 20);\n    GPIOA->AFR[1] = (GPIOA->AFR[1] & ~((0xFu << 4) | (0xFu << 8))) |\n                    (7u << 4) | (7u << 8);\n    GPIOA->OSPEEDR |= (3u << 18) | (3u << 20);\n    GPIOA->PUPDR = (GPIOA->PUPDR & ~((3u << 18) | (3u << 20))) | (1u << 20);\n\n    USART1->CR1 = 0u;\n    USART1->CR2 = 0u;\n    USART1->CR3 = 0u;\n    /* Calibrated on this board: USART1 sees an effective 5.25 MHz,\n     * so BRR = 84e6 / baud (115200 -> 729 = 0x2D9, matching the\n     * vendor demo that works on this wiring). */\n    USART1->BRR = (uint16_t)((84000000u + baud / 2u) / baud);\n\n    USART1->CR1 = USART_CR1_UE | USART_CR1_TE | USART_CR1_RE;\n}\n\nvoid ab_uart_putc(uint8_t c)\n{\n    while ((USART1->SR & USART_SR_TXE) == 0u) {\n    }\n    USART1->DR = c;\n}\n\nvoid ab_uart_write(const void *data, uint32_t len)\n{\n    const uint8_t *p = (const uint8_t *)data;\n\n    while (len-- != 0u) {\n        ab_uart_putc(*p++);\n    }\n    while ((USART1->SR & USART_SR_TC) == 0u) {\n    }\n}\n\nvoid ab_uart_write_str(const char *s)\n{\n    while (*s != '\\0') {\n        ab_uart_putc((uint8_t)*s++);\n    }\n}\n\nint ab_uart_getc(uint8_t *c, uint32_t timeout_ms)\n{\n    uint32_t start = ab_millis();\n\n    for (;;) {\n        uint32_t sr = USART1->SR;\n\n        if ((sr & USART_SR_RXNE) != 0u) {\n            *c = (uint8_t)(USART1->DR & 0xFFu);\n            return 0;\n        }\n        if ((sr & USART_SR_ORE) != 0u) {\n            (void)USART1->DR;\n        }\n        if ((ab_millis() - start) >= timeout_ms) {\n            return -1;\n        }\n    }\n}\n\nvoid ab_uart_rx_flush(void)\n{\n    uint32_t guard = 64u;\n\n    while (guard-- != 0u) {\n        if ((USART1->SR & USART_SR_RXNE) == 0u) {\n            break;\n        }\n        (void)USART1->DR;\n    }\n}\n", "bootloader/Src/ab_util.c": "/**\n * @file  ab_util.c\n * @brief CRC32 (nibble table, small) and SHA-256 (FIPS 180-4).\n */\n#include \"ab_util.h\"\n\n/* ------------------------------------------------------------------ CRC32 */\nstatic const uint32_t crc32_nibble[16] = {\n    0x00000000u, 0x1DB71064u, 0x3B6E20C8u, 0x26D930ACu,\n    0x76DC4190u, 0x6B6B51F4u, 0x4DB26158u, 0x5005713Cu,\n    0xEDB88320u, 0xF00F9344u, 0xD6D6A3E8u, 0xCB61B38Cu,\n    0x9B64C2B0u, 0x86D3D2D4u, 0xA00AE278u, 0xBDBDF21Cu\n};\n\nuint32_t ab_crc32_start(void)\n{\n    return 0xFFFFFFFFu;\n}\n\nuint32_t ab_crc32_update(uint32_t crc, const void *data, uint32_t len)\n{\n    const uint8_t *p = (const uint8_t *)data;\n\n    while (len-- != 0u) {\n        crc ^= *p++;\n        crc = (crc >> 4) ^ crc32_nibble[crc & 0x0Fu];\n        crc = (crc >> 4) ^ crc32_nibble[crc & 0x0Fu];\n    }\n    return crc;\n}\n\nuint32_t ab_crc32_final(uint32_t crc)\n{\n    return crc ^ 0xFFFFFFFFu;\n}\n\nuint32_t ab_crc32(const void *data, uint32_t len)\n{\n    return ab_crc32_final(ab_crc32_update(ab_crc32_start(), data, len));\n}\n\n/* ----------------------------------------------------------------- SHA-256 */\n#define ROR(x, n) (((x) >> (n)) | ((x) << (32u - (n))))\n\nstatic const uint32_t K[64] = {\n    0x428a2f98u, 0x71374491u, 0xb5c0fbcfu, 0xe9b5dba5u, 0x3956c25bu, 0x59f111f1u,\n    0x923f82a4u, 0xab1c5ed5u, 0xd807aa98u, 0x12835b01u, 0x243185beu, 0x550c7dc3u,\n    0x72be5d74u, 0x80deb1feu, 0x9bdc06a7u, 0xc19bf174u, 0xe49b69c1u, 0xefbe4786u,\n    0x0fc19dc6u, 0x240ca1ccu, 0x2de92c6fu, 0x4a7484aau, 0x5cb0a9dcu, 0x76f988dau,\n    0x983e5152u, 0xa831c66du, 0xb00327c8u, 0xbf597fc7u, 0xc6e00bf3u, 0xd5a79147u,\n    0x06ca6351u, 0x14292967u, 0x27b70a85u, 0x2e1b2138u, 0x4d2c6dfcu, 0x53380d13u,\n    0x650a7354u, 0x766a0abbu, 0x81c2c92eu, 0x92722c85u, 0xa2bfe8a1u, 0xa81a664bu,\n    0xc24b8b70u, 0xc76c51a3u, 0xd192e819u, 0xd6990624u, 0xf40e3585u, 0x106aa070u,\n    0x19a4c116u, 0x1e376c08u, 0x2748774cu, 0x34b0bcb5u, 0x391c0cb3u, 0x4ed8aa4au,\n    0x5b9cca4fu, 0x682e6ff3u, 0x748f82eeu, 0x78a5636fu, 0x84c87814u, 0x8cc70208u,\n    0x90befffau, 0xa4506cebu, 0xbef9a3f7u, 0xc67178f2u\n};\n\nstatic void sha256_block(ab_sha256_ctx *ctx, const uint8_t *p)\n{\n    uint32_t w[64];\n    uint32_t a, b, c, d, e, f, g, h;\n    uint32_t i;\n\n    for (i = 0; i < 16u; i++) {\n        w[i] = ((uint32_t)p[i * 4u] << 24) |\n               ((uint32_t)p[i * 4u + 1u] << 16) |\n               ((uint32_t)p[i * 4u + 2u] << 8) |\n               ((uint32_t)p[i * 4u + 3u]);\n    }\n    for (i = 16; i < 64u; i++) {\n        uint32_t s0 = ROR(w[i - 15u], 7) ^ ROR(w[i - 15u], 18) ^ (w[i - 15u] >> 3);\n        uint32_t s1 = ROR(w[i - 2u], 17) ^ ROR(w[i - 2u], 19) ^ (w[i - 2u] >> 10);\n        w[i] = w[i - 16u] + s0 + w[i - 7u] + s1;\n    }\n\n    a = ctx->h[0]; b = ctx->h[1]; c = ctx->h[2]; d = ctx->h[3];\n    e = ctx->h[4]; f = ctx->h[5]; g = ctx->h[6]; h = ctx->h[7];\n\n    for (i = 0; i < 64u; i++) {\n        uint32_t s1 = ROR(e, 6) ^ ROR(e, 11) ^ ROR(e, 25);\n        uint32_t ch = (e & f) ^ ((~e) & g);\n        uint32_t t1 = h + s1 + ch + K[i] + w[i];\n        uint32_t s0 = ROR(a, 2) ^ ROR(a, 13) ^ ROR(a, 22);\n        uint32_t maj = (a & b) ^ (a & c) ^ (b & c);\n        uint32_t t2 = s0 + maj;\n\n        h = g; g = f; f = e; e = d + t1;\n        d = c; c = b; b = a; a = t1 + t2;\n    }\n\n    ctx->h[0] += a; ctx->h[1] += b; ctx->h[2] += c; ctx->h[3] += d;\n    ctx->h[4] += e; ctx->h[5] += f; ctx->h[6] += g; ctx->h[7] += h;\n}\n\nvoid ab_sha256_init(ab_sha256_ctx *ctx)\n{\n    ctx->h[0] = 0x6a09e667u; ctx->h[1] = 0xbb67ae85u;\n    ctx->h[2] = 0x3c6ef372u; ctx->h[3] = 0xa54ff53au;\n    ctx->h[4] = 0x510e527fu; ctx->h[5] = 0x9b05688cu;\n    ctx->h[6] = 0x1f83d9abu; ctx->h[7] = 0x5be0cd19u;\n    ctx->total = 0u;\n    ctx->used = 0u;\n}\n\nvoid ab_sha256_update(ab_sha256_ctx *ctx, const void *data, uint32_t len)\n{\n    const uint8_t *p = (const uint8_t *)data;\n\n    ctx->total += len;\n\n    while (len-- != 0u) {\n        ctx->buf[ctx->used++] = *p++;\n        if (ctx->used == 64u) {\n            sha256_block(ctx, ctx->buf);\n            ctx->used = 0u;\n        }\n    }\n}\n\nvoid ab_sha256_final(ab_sha256_ctx *ctx, uint8_t out[32])\n{\n    uint64_t bits = ctx->total * 8u;\n    uint32_t i;\n\n    ctx->buf[ctx->used++] = 0x80u;\n    if (ctx->used > 56u) {\n        while (ctx->used < 64u) {\n            ctx->buf[ctx->used++] = 0u;\n        }\n        sha256_block(ctx, ctx->buf);\n        ctx->used = 0u;\n    }\n    while (ctx->used < 56u) {\n        ctx->buf[ctx->used++] = 0u;\n    }\n    for (i = 0; i < 8u; i++) {\n        ctx->buf[56u + i] = (uint8_t)(bits >> (56u - 8u * i));\n    }\n    sha256_block(ctx, ctx->buf);\n\n    for (i = 0; i < 8u; i++) {\n        out[i * 4u]      = (uint8_t)(ctx->h[i] >> 24);\n        out[i * 4u + 1u] = (uint8_t)(ctx->h[i] >> 16);\n        out[i * 4u + 2u] = (uint8_t)(ctx->h[i] >> 8);\n        out[i * 4u + 3u] = (uint8_t)(ctx->h[i]);\n    }\n}\n\nvoid ab_sha256(const void *data, uint32_t len, uint8_t out[32])\n{\n    ab_sha256_ctx ctx;\n\n    ab_sha256_init(&ctx);\n    ab_sha256_update(&ctx, data, len);\n    ab_sha256_final(&ctx, out);\n}\n", "bootloader/Src/main.c": "/**\n * @file  main.c\n * @brief A/B serial IAP bootloader for STM32F407VE.\n *\n * Boot policy:\n *   1. newest metadata record decides the active slot and its state\n *   2. TRIAL: increment the attempt counter and boot; after AB_MAX_ATTEMPTS\n *      consecutive unconfirmed boots the image is marked BAD and the other\n *      slot is booted instead (no copy, both slots are runnable in place)\n *   3. CONFIRMED: boot directly\n *   4. update request (RAM magic / key / metadata flag) keeps the bootloader\n *      resident; otherwise a short UART window allows the host to catch it\n */\n#include \"stm32f4xx.h\"\n#include \"ab_api.h\"\n#include \"ab_config.h\"\n#include \"ab_image.h\"\n#include \"ab_meta.h\"\n#include \"ab_proto.h\"\n#include \"ab_uart.h\"\n#include <string.h>\n\n#define AB_UART_WINDOW_MS   400u\n\nstatic void print_str(const char *s)\n{\n    ab_uart_write_str(s);\n}\n\nstatic void print_hex32(uint32_t v)\n{\n    static const char hex[] = \"0123456789ABCDEF\";\n    char buf[11];\n    int i;\n\n    buf[0] = '0';\n    buf[1] = 'x';\n    for (i = 0; i < 8; i++) {\n        buf[2 + i] = hex[(v >> (28 - 4 * i)) & 0xFu];\n    }\n    buf[10] = '\\0';\n    print_str(buf);\n}\n\nstatic void print_dec(uint32_t v)\n{\n    char buf[11];\n    int i = 10;\n\n    buf[10] = '\\0';\n    do {\n        buf[--i] = (char)('0' + (v % 10u));\n        v /= 10u;\n    } while (v != 0u && i > 0);\n    print_str(&buf[i]);\n}\n\nstatic void boot_gpio_init(void)\n{\n    RCC->AHB1ENR |= RCC_AHB1ENR_GPIOEEN;\n    GPIOE->MODER &= ~(3u << 6);            /* PE3 input */\n    GPIOE->PUPDR = (GPIOE->PUPDR & ~(3u << 6)) | (1u << 6);\n}\n\nstatic int button_pressed(void)\n{\n    return (GPIOE->IDR & (1u << 3)) == 0u;\n}\n\nstatic void jump_to(uint8_t slot)\n{\n    uint32_t base = ab_slot_base(slot);\n    uint32_t sp = *(volatile uint32_t *)(uintptr_t)base;\n    uint32_t rv = *(volatile uint32_t *)(uintptr_t)(base + 4u);\n    uint32_t i;\n\n    SysTick->CTRL = 0u;\n    SysTick->LOAD = 0u;\n    SysTick->VAL = 0u;\n\n    __disable_irq();\n    for (i = 0; i < 8u; i++) {\n        NVIC->ICER[i] = 0xFFFFFFFFu;\n        NVIC->ICPR[i] = 0xFFFFFFFFu;\n    }\n    SCB->VTOR = base;\n    __DSB();\n    __ISB();\n    __set_MSP(sp);\n    __DSB();\n    __ISB();\n    /* The application expects the reset state: PRIMASK cleared.  Without this\n     * its SysTick never fires and delay loops hang until the watchdog bites. */\n    __enable_irq();\n    ((void (*)(void))rv)();\n\n    for (;;) {\n    }\n}\n\n/* Boot the other slot after the trial image failed.  Returns 1 on success. */\nstatic int rollback(uint8_t failed_slot)\n{\n    uint8_t other = ab_slot_other(failed_slot);\n    ab_meta_rec_t rec;\n\n    if (!ab_meta_find(other, &rec)) {\n        return 0;\n    }\n    if (rec.img_size != 0u) {\n        if (!ab_image_verify(&rec, 0)) {\n            return 0;\n        }\n    } else if (!ab_image_vectors_ok(other)) {\n        return 0;\n    }\n\n    rec.state = AB_ST_CONFIRMED;\n    rec.attempts = 0u;\n    rec.flags = 0u;\n    if (ab_meta_append(&rec, 1) != 0) {\n        return 0;\n    }\n    return 1;\n}\n\nint main(void)\n{\n    ab_meta_rec_t latest;\n    uint8_t active;\n    uint8_t state;\n    int have;\n    int request;\n\n    ab_clock_init();\n    ab_time_init();\n    ab_uart_init(AB_DEFAULT_BAUD);\n    boot_gpio_init();\n\n    print_str(\"\\r\\nAB-IAP boot v1.0\\r\\n\");\n\n    ab_api_publish();\n\n    request = (*(volatile uint32_t *)(uintptr_t)AB_REQ_ADDR) == AB_REQ_MAGIC;\n    *(volatile uint32_t *)(uintptr_t)AB_REQ_ADDR = 0u;\n\n    have = ab_meta_load(&latest);\n    active = have ? latest.slot : AB_SLOT_A;\n    state = have ? latest.state : AB_ST_CONFIRMED;\n\n    if (!have && !ab_image_vectors_ok(AB_SLOT_A)) {\n        print_str(\"meta: empty, slot A blank\\r\\n\");\n        goto recovery;\n    }\n    if (!have) {\n        /* Factory provisioning: remember the image we are about to trust so a\n         * later rollback has a slot to go back to.  Size/CRC are unknown here,\n         * so only the vector table is checked for this record. */\n        ab_meta_rec_t boot_rec;\n\n        memset(&boot_rec, 0, sizeof(boot_rec));\n        boot_rec.slot = AB_SLOT_A;\n        boot_rec.state = AB_ST_CONFIRMED;\n        boot_rec.version = 0u;\n        boot_rec.img_size = 0u;\n        boot_rec.attempts = 0u;\n        (void)ab_meta_append(&boot_rec, 1);\n    }\n\n    if (state == AB_ST_TRIAL) {\n        if (!ab_image_verify(&latest, 1)) {\n            print_str(\"trial image invalid, rolling back\\r\\n\");\n            if (!rollback(active)) {\n                goto recovery;\n            }\n        } else if (latest.attempts >= AB_MAX_ATTEMPTS) {\n            print_str(\"trial attempts exhausted, rolling back\\r\\n\");\n            if (!rollback(active)) {\n                goto recovery;\n            }\n        } else {\n            latest.attempts++;\n            (void)ab_meta_append(&latest, 1);\n            print_str(\"trial boot \");\n            print_dec(latest.attempts);\n            print_str(\"/\");\n            print_dec(AB_MAX_ATTEMPTS);\n            print_str(\"\\r\\n\");\n        }\n    } else if (state == AB_ST_BAD) {\n        if (!rollback(active)) {\n            goto recovery;\n        }\n    }\n\nreload:\n    have = ab_meta_load(&latest);\n    active = have ? latest.slot : AB_SLOT_A;\n    state = have ? latest.state : AB_ST_CONFIRMED;\n\n    print_str(\"meta: slot=\");\n    print_str(active == AB_SLOT_A ? \"A\" : \"B\");\n    print_str(\" state=\");\n    print_dec(state);\n    print_str(\" attempts=\");\n    print_dec(have ? latest.attempts : 0u);\n    print_str(\"\\r\\n\");\n\n    if (have && (latest.flags & AB_FLAG_UPDATE_REQ) != 0u) {\n        latest.flags = 0u;\n        (void)ab_meta_append(&latest, 1);\n        request = 1;\n    }\n\n    if (request || button_pressed()) {\n        print_str(\"update mode requested\\r\\n\");\n        ab_proto_run();\n    }\n\n    if (ab_proto_listen(AB_UART_WINDOW_MS)) {\n        print_str(\"update mode\\r\\n\");\n        ab_proto_run();\n    }\n\n    print_str(\"boot \");\n    print_str(active == AB_SLOT_A ? \"A\" : \"B\");\n    print_str(\" @\");\n    print_hex32(ab_slot_base(active));\n    print_str(\"\\r\\n\");\n    jump_to(active);\n\nrecovery:\n    print_str(\"recovery: waiting for firmware\\r\\n\");\n    ab_proto_run();\n    return 0;\n}\n", "bootloader/Src/system_stm32f4xx.c": "/**\n  ******************************************************************************\n  * @file    system_stm32f4xx.c\n  * @author  MCD Application Team\n  * @brief   CMSIS Cortex-M4 Device Peripheral Access Layer System Source File.\n  *\n  *   This file provides two functions and one global variable to be called from \n  *   user application:\n  *      - SystemInit(): This function is called at startup just after reset and \n  *                      before branch to main program. This call is made inside\n  *                      the \"startup_stm32f4xx.s\" file.\n  *\n  *      - SystemCoreClock variable: Contains the core clock (HCLK), it can be used\n  *                                  by the user application to setup the SysTick \n  *                                  timer or configure other parameters.\n  *                                     \n  *      - SystemCoreClockUpdate(): Updates the variable SystemCoreClock and must\n  *                                 be called whenever the core clock is changed\n  *                                 during program execution.\n  *\n  *\n  ******************************************************************************\n  * @attention\n  *\n  * Copyright (c) 2017 STMicroelectronics.\n  * All rights reserved.\n  *\n  * This software is licensed under terms that can be found in the LICENSE file\n  * in the root directory of this software component.\n  * If no LICENSE file comes with this software, it is provided AS-IS.\n  *\n  ******************************************************************************\n  */\n\n/** @addtogroup CMSIS\n  * @{\n  */\n\n/** @addtogroup stm32f4xx_system\n  * @{\n  */  \n  \n/** @addtogroup STM32F4xx_System_Private_Includes\n  * @{\n  */\n\n\n#include \"stm32f4xx.h\"\n\n#if !defined  (HSE_VALUE) \n  #define HSE_VALUE    ((uint32_t)25000000) /*!< Default value of the External oscillator in Hz */\n#endif /* HSE_VALUE */\n\n#if !defined  (HSI_VALUE)\n  #define HSI_VALUE    ((uint32_t)16000000) /*!< Value of the Internal oscillator in Hz*/\n#endif /* HSI_VALUE */\n\n/**\n  * @}\n  */\n\n/** @addtogroup STM32F4xx_System_Private_TypesDefinitions\n  * @{\n  */\n\n/**\n  * @}\n  */\n\n/** @addtogroup STM32F4xx_System_Private_Defines\n  * @{\n  */\n\n/************************* Miscellaneous Configuration ************************/\n/*!< Uncomment the following line if you need to use external SRAM or SDRAM as data memory  */\n#if defined(STM32F405xx) || defined(STM32F415xx) || defined(STM32F407xx) || defined(STM32F417xx)\\\n || defined(STM32F427xx) || defined(STM32F437xx) || defined(STM32F429xx) || defined(STM32F439xx)\\\n || defined(STM32F469xx) || defined(STM32F479xx) || defined(STM32F412Zx) || defined(STM32F412Vx)\n/* #define DATA_IN_ExtSRAM */\n#endif /* STM32F40xxx || STM32F41xxx || STM32F42xxx || STM32F43xxx || STM32F469xx || STM32F479xx ||\\\n          STM32F412Zx || STM32F412Vx */\n \n#if defined(STM32F427xx) || defined(STM32F437xx) || defined(STM32F429xx) || defined(STM32F439xx)\\\n || defined(STM32F446xx) || defined(STM32F469xx) || defined(STM32F479xx)\n/* #define DATA_IN_ExtSDRAM */\n#endif /* STM32F427xx || STM32F437xx || STM32F429xx || STM32F439xx || STM32F446xx || STM32F469xx ||\\\n          STM32F479xx */\n\n/* Note: Following vector table addresses must be defined in line with linker\n         configuration. */\n/*!< Uncomment the following line if you need to relocate the vector table\n     anywhere in Flash or Sram, else the vector table is kept at the automatic\n     remap of boot address selected */\n/* #define USER_VECT_TAB_ADDRESS */\n\n#if defined(USER_VECT_TAB_ADDRESS)\n/*!< Uncomment the following line if you need to relocate your vector Table\n     in Sram else user remap will be done in Flash. */\n/* #define VECT_TAB_SRAM */\n#if defined(VECT_TAB_SRAM)\n#define VECT_TAB_BASE_ADDRESS   SRAM_BASE       /*!< Vector Table base address field.\n                                                     This value must be a multiple of 0x200. */\n#else\n#define VECT_TAB_BASE_ADDRESS   FLASH_BASE      /*!< Vector Table base address field.\n                                                     This value must be a multiple of 0x200. */\n#endif /* VECT_TAB_SRAM */\n#if !defined(VECT_TAB_OFFSET)\n#define VECT_TAB_OFFSET         0x00000000U     /*!< Vector Table offset field.\n                                                     This value must be a multiple of 0x200. */\n#endif /* VECT_TAB_OFFSET */\n#endif /* USER_VECT_TAB_ADDRESS */\n/******************************************************************************/\n\n/**\n  * @}\n  */\n\n/** @addtogroup STM32F4xx_System_Private_Macros\n  * @{\n  */\n\n/**\n  * @}\n  */\n\n/** @addtogroup STM32F4xx_System_Private_Variables\n  * @{\n  */\n  /* This variable is updated in three ways:\n      1) by calling CMSIS function SystemCoreClockUpdate()\n      2) by calling HAL API function HAL_RCC_GetHCLKFreq()\n      3) each time HAL_RCC_ClockConfig() is called to configure the system clock frequency \n         Note: If you use this function to configure the system clock; then there\n               is no need to call the 2 first functions listed above, since SystemCoreClock\n               variable is updated automatically.\n  */\nuint32_t SystemCoreClock = 16000000;\nconst uint8_t AHBPrescTable[16] = {0, 0, 0, 0, 0, 0, 0, 0, 1, 2, 3, 4, 6, 7, 8, 9};\nconst uint8_t APBPrescTable[8]  = {0, 0, 0, 0, 1, 2, 3, 4};\n/**\n  * @}\n  */\n\n/** @addtogroup STM32F4xx_System_Private_FunctionPrototypes\n  * @{\n  */\n\n#if defined (DATA_IN_ExtSRAM) || defined (DATA_IN_ExtSDRAM)\n  static void SystemInit_ExtMemCtl(void); \n#endif /* DATA_IN_ExtSRAM || DATA_IN_ExtSDRAM */\n\n/**\n  * @}\n  */\n\n/** @addtogroup STM32F4xx_System_Private_Functions\n  * @{\n  */\n\n/**\n  * @brief  Setup the microcontroller system\n  *         Initialize the FPU setting, vector table location and External memory \n  *         configuration.\n  * @param  None\n  * @retval None\n  */\nvoid SystemInit(void)\n{\n  /* FPU settings ------------------------------------------------------------*/\n  #if (__FPU_PRESENT == 1) && (__FPU_USED == 1)\n    SCB->CPACR |= ((3UL << 10*2)|(3UL << 11*2));  /* set CP10 and CP11 Full Access */\n  #endif\n\n#if defined (DATA_IN_ExtSRAM) || defined (DATA_IN_ExtSDRAM)\n  SystemInit_ExtMemCtl(); \n#endif /* DATA_IN_ExtSRAM || DATA_IN_ExtSDRAM */\n\n  /* Configure the Vector Table location -------------------------------------*/\n#if defined(USER_VECT_TAB_ADDRESS)\n  SCB->VTOR = VECT_TAB_BASE_ADDRESS | VECT_TAB_OFFSET; /* Vector Table Relocation in Internal SRAM */\n#endif /* USER_VECT_TAB_ADDRESS */\n}\n\n/**\n   * @brief  Update SystemCoreClock variable according to Clock Register Values.\n  *         The SystemCoreClock variable contains the core clock (HCLK), it can\n  *         be used by the user application to setup the SysTick timer or configure\n  *         other parameters.\n  *           \n  * @note   Each time the core clock (HCLK) changes, this function must be called\n  *         to update SystemCoreClock variable value. Otherwise, any configuration\n  *         based on this variable will be incorrect.         \n  *     \n  * @note   - The system frequency computed by this function is not the real \n  *           frequency in the chip. It is calculated based on the predefined \n  *           constant and the selected clock source:\n  *             \n  *           - If SYSCLK source is HSI, SystemCoreClock will contain the HSI_VALUE(*)\n  *                                              \n  *           - If SYSCLK source is HSE, SystemCoreClock will contain the HSE_VALUE(**)\n  *                          \n  *           - If SYSCLK source is PLL, SystemCoreClock will contain the HSE_VALUE(**) \n  *             or HSI_VALUE(*) multiplied/divided by the PLL factors.\n  *         \n  *         (*) HSI_VALUE is a constant defined in stm32f4xx_hal_conf.h file (default value\n  *             16 MHz) but the real value may vary depending on the variations\n  *             in voltage and temperature.   \n  *    \n  *         (**) HSE_VALUE is a constant defined in stm32f4xx_hal_conf.h file (its value\n  *              depends on the application requirements), user has to ensure that HSE_VALUE\n  *              is same as the real frequency of the crystal used. Otherwise, this function\n  *              may have wrong result.\n  *                \n  *         - The result of this function could be not correct when using fractional\n  *           value for HSE crystal.\n  *     \n  * @param  None\n  * @retval None\n  */\nvoid SystemCoreClockUpdate(void)\n{\n  uint32_t tmp, pllvco, pllp, pllsource, pllm;\n  \n  /* Get SYSCLK source -------------------------------------------------------*/\n  tmp = RCC->CFGR & RCC_CFGR_SWS;\n\n  switch (tmp)\n  {\n    case 0x00:  /* HSI used as system clock source */\n      SystemCoreClock = HSI_VALUE;\n      break;\n    case 0x04:  /* HSE used as system clock source */\n      SystemCoreClock = HSE_VALUE;\n      break;\n    case 0x08:  /* PLL used as system clock source */\n\n      /* PLL_VCO = (HSE_VALUE or HSI_VALUE / PLL_M) * PLL_N\n         SYSCLK = PLL_VCO / PLL_P\n         */    \n      pllsource = (RCC->PLLCFGR & RCC_PLLCFGR_PLLSRC) >> 22;\n      pllm = RCC->PLLCFGR & RCC_PLLCFGR_PLLM;\n      \n      if (pllsource != 0)\n      {\n        /* HSE used as PLL clock source */\n        pllvco = (HSE_VALUE / pllm) * ((RCC->PLLCFGR & RCC_PLLCFGR_PLLN) >> 6);\n      }\n      else\n      {\n        /* HSI used as PLL clock source */\n        pllvco = (HSI_VALUE / pllm) * ((RCC->PLLCFGR & RCC_PLLCFGR_PLLN) >> 6);\n      }\n\n      pllp = (((RCC->PLLCFGR & RCC_PLLCFGR_PLLP) >>16) + 1 ) *2;\n      SystemCoreClock = pllvco/pllp;\n      break;\n    default:\n      SystemCoreClock = HSI_VALUE;\n      break;\n  }\n  /* Compute HCLK frequency --------------------------------------------------*/\n  /* Get HCLK prescaler */\n  tmp = AHBPrescTable[((RCC->CFGR & RCC_CFGR_HPRE) >> 4)];\n  /* HCLK frequency */\n  SystemCoreClock >>= tmp;\n}\n\n#if defined (DATA_IN_ExtSRAM) && defined (DATA_IN_ExtSDRAM)\n#if defined(STM32F427xx) || defined(STM32F437xx) || defined(STM32F429xx) || defined(STM32F439xx)\\\n || defined(STM32F469xx) || defined(STM32F479xx)\n/**\n  * @brief  Setup the external memory controller.\n  *         Called in startup_stm32f4xx.s before jump to main.\n  *         This function configures the external memories (SRAM/SDRAM)\n  *         This SRAM/SDRAM will be used as program data memory (including heap and stack).\n  * @param  None\n  * @retval None\n  */\nvoid SystemInit_ExtMemCtl(void)\n{\n  __IO uint32_t tmp = 0x00;\n\n  register uint32_t tmpreg = 0, timeout = 0xFFFF;\n  register __IO uint32_t index;\n\n  /* Enable GPIOC, GPIOD, GPIOE, GPIOF, GPIOG, GPIOH and GPIOI interface clock */\n  RCC->AHB1ENR |= 0x000001F8;\n\n  /* Delay after an RCC peripheral clock enabling */\n  tmp = READ_BIT(RCC->AHB1ENR, RCC_AHB1ENR_GPIOCEN);\n  \n  /* Connect PDx pins to FMC Alternate function */\n  GPIOD->AFR[0]  = 0x00CCC0CC;\n  GPIOD->AFR[1]  = 0xCCCCCCCC;\n  /* Configure PDx pins in Alternate function mode */  \n  GPIOD->MODER   = 0xAAAA0A8A;\n  /* Configure PDx pins speed to 100 MHz */  \n  GPIOD->OSPEEDR = 0xFFFF0FCF;\n  /* Configure PDx pins Output type to push-pull */  \n  GPIOD->OTYPER  = 0x00000000;\n  /* No pull-up, pull-down for PDx pins */ \n  GPIOD->PUPDR   = 0x00000000;\n\n  /* Connect PEx pins to FMC Alternate function */\n  GPIOE->AFR[0]  = 0xC00CC0CC;\n  GPIOE->AFR[1]  = 0xCCCCCCCC;\n  /* Configure PEx pins in Alternate function mode */ \n  GPIOE->MODER   = 0xAAAA828A;\n  /* Configure PEx pins speed to 100 MHz */ \n  GPIOE->OSPEEDR = 0xFFFFC3CF;\n  /* Configure PEx pins Output type to push-pull */  \n  GPIOE->OTYPER  = 0x00000000;\n  /* No pull-up, pull-down for PEx pins */ \n  GPIOE->PUPDR   = 0x00000000;\n  \n  /* Connect PFx pins to FMC Alternate function */\n  GPIOF->AFR[0]  = 0xCCCCCCCC;\n  GPIOF->AFR[1]  = 0xCCCCCCCC;\n  /* Configure PFx pins in Alternate function mode */   \n  GPIOF->MODER   = 0xAA800AAA;\n  /* Configure PFx pins speed to 50 MHz */ \n  GPIOF->OSPEEDR = 0xAA800AAA;\n  /* Configure PFx pins Output type to push-pull */  \n  GPIOF->OTYPER  = 0x00000000;\n  /* No pull-up, pull-down for PFx pins */ \n  GPIOF->PUPDR   = 0x00000000;\n\n  /* Connect PGx pins to FMC Alternate function */\n  GPIOG->AFR[0]  = 0xCCCCCCCC;\n  GPIOG->AFR[1]  = 0xCCCCCCCC;\n  /* Configure PGx pins in Alternate function mode */ \n  GPIOG->MODER   = 0xAAAAAAAA;\n  /* Configure PGx pins speed to 50 MHz */ \n  GPIOG->OSPEEDR = 0xAAAAAAAA;\n  /* Configure PGx pins Output type to push-pull */  \n  GPIOG->OTYPER  = 0x00000000;\n  /* No pull-up, pull-down for PGx pins */ \n  GPIOG->PUPDR   = 0x00000000;\n  \n  /* Connect PHx pins to FMC Alternate function */\n  GPIOH->AFR[0]  = 0x00C0CC00;\n  GPIOH->AFR[1]  = 0xCCCCCCCC;\n  /* Configure PHx pins in Alternate function mode */ \n  GPIOH->MODER   = 0xAAAA08A0;\n  /* Configure PHx pins speed to 50 MHz */ \n  GPIOH->OSPEEDR = 0xAAAA08A0;\n  /* Configure PHx pins Output type to push-pull */  \n  GPIOH->OTYPER  = 0x00000000;\n  /* No pull-up, pull-down for PHx pins */ \n  GPIOH->PUPDR   = 0x00000000;\n  \n  /* Connect PIx pins to FMC Alternate function */\n  GPIOI->AFR[0]  = 0xCCCCCCCC;\n  GPIOI->AFR[1]  = 0x00000CC0;\n  /* Configure PIx pins in Alternate function mode */ \n  GPIOI->MODER   = 0x0028AAAA;\n  /* Configure PIx pins speed to 50 MHz */ \n  GPIOI->OSPEEDR = 0x0028AAAA;\n  /* Configure PIx pins Output type to push-pull */  \n  GPIOI->OTYPER  = 0x00000000;\n  /* No pull-up, pull-down for PIx pins */ \n  GPIOI->PUPDR   = 0x00000000;\n  \n/*-- FMC Configuration -------------------------------------------------------*/\n  /* Enable the FMC interface clock */\n  RCC->AHB3ENR |= 0x00000001;\n  /* Delay after an RCC peripheral clock enabling */\n  tmp = READ_BIT(RCC->AHB3ENR, RCC_AHB3ENR_FMCEN);\n\n  FMC_Bank5_6->SDCR[0] = 0x000019E4;\n  FMC_Bank5_6->SDTR[0] = 0x01115351;      \n  \n  /* SDRAM initialization sequence */\n  /* Clock enable command */\n  FMC_Bank5_6->SDCMR = 0x00000011; \n  tmpreg = FMC_Bank5_6->SDSR & 0x00000020; \n  while((tmpreg != 0) && (timeout-- > 0))\n  {\n    tmpreg = FMC_Bank5_6->SDSR & 0x00000020; \n  }\n\n  /* Delay */\n  for (index = 0; index<1000; index++);\n  \n  /* PALL command */\n  FMC_Bank5_6->SDCMR = 0x00000012;           \n  tmpreg = FMC_Bank5_6->SDSR & 0x00000020;\n  timeout = 0xFFFF;\n  while((tmpreg != 0) && (timeout-- > 0))\n  {\n    tmpreg = FMC_Bank5_6->SDSR & 0x00000020; \n  }\n  \n  /* Auto refresh command */\n  FMC_Bank5_6->SDCMR = 0x00000073;\n  tmpreg = FMC_Bank5_6->SDSR & 0x00000020;\n  timeout = 0xFFFF;\n  while((tmpreg != 0) && (timeout-- > 0))\n  {\n    tmpreg = FMC_Bank5_6->SDSR & 0x00000020; \n  }\n \n  /* MRD register program */\n  FMC_Bank5_6->SDCMR = 0x00046014;\n  tmpreg = FMC_Bank5_6->SDSR & 0x00000020;\n  timeout = 0xFFFF;\n  while((tmpreg != 0) && (timeout-- > 0))\n  {\n    tmpreg = FMC_Bank5_6->SDSR & 0x00000020; \n  } \n  \n  /* Set refresh count */\n  tmpreg = FMC_Bank5_6->SDRTR;\n  FMC_Bank5_6->SDRTR = (tmpreg | (0x0000027C<<1));\n  \n  /* Disable write protection */\n  tmpreg = FMC_Bank5_6->SDCR[0]; \n  FMC_Bank5_6->SDCR[0] = (tmpreg & 0xFFFFFDFF);\n\n#if defined(STM32F427xx) || defined(STM32F437xx) || defined(STM32F429xx) || defined(STM32F439xx)\n  /* Configure and enable Bank1_SRAM2 */\n  FMC_Bank1->BTCR[2]  = 0x00001011;\n  FMC_Bank1->BTCR[3]  = 0x00000201;\n  FMC_Bank1E->BWTR[2] = 0x0fffffff;\n#endif /* STM32F427xx || STM32F437xx || STM32F429xx || STM32F439xx */ \n#if defined(STM32F469xx) || defined(STM32F479xx)\n  /* Configure and enable Bank1_SRAM2 */\n  FMC_Bank1->BTCR[2]  = 0x00001091;\n  FMC_Bank1->BTCR[3]  = 0x00110212;\n  FMC_Bank1E->BWTR[2] = 0x0fffffff;\n#endif /* STM32F469xx || STM32F479xx */\n\n  (void)(tmp); \n}\n#endif /* STM32F427xx || STM32F437xx || STM32F429xx || STM32F439xx || STM32F469xx || STM32F479xx */\n#elif defined (DATA_IN_ExtSRAM) || defined (DATA_IN_ExtSDRAM)\n/**\n  * @brief  Setup the external memory controller.\n  *         Called in startup_stm32f4xx.s before jump to main.\n  *         This function configures the external memories (SRAM/SDRAM)\n  *         This SRAM/SDRAM will be used as program data memory (including heap and stack).\n  * @param  None\n  * @retval None\n  */\nvoid SystemInit_ExtMemCtl(void)\n{\n  __IO uint32_t tmp = 0x00;\n#if defined(STM32F427xx) || defined(STM32F437xx) || defined(STM32F429xx) || defined(STM32F439xx)\\\n || defined(STM32F446xx) || defined(STM32F469xx) || defined(STM32F479xx)\n#if defined (DATA_IN_ExtSDRAM)\n  register uint32_t tmpreg = 0, timeout = 0xFFFF;\n  register __IO uint32_t index;\n\n#if defined(STM32F446xx)\n  /* Enable GPIOA, GPIOC, GPIOD, GPIOE, GPIOF, GPIOG interface\n      clock */\n  RCC->AHB1ENR |= 0x0000007D;\n#else\n  /* Enable GPIOC, GPIOD, GPIOE, GPIOF, GPIOG, GPIOH and GPIOI interfac
