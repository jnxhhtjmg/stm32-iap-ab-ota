l\" stops feeding the dog, the reset is\n *     counted by the bootloader and after AB_MAX_ATTEMPTS the old slot is back\n *   - \"boot\" jumps back to the bootloader on request, no reset button needed\n */\n#include \"stm32f4xx.h\"\n#include \"ab_config.h\"\n#include \"app_config.h\"\n#include \"oled.h\"\n#include <stdint.h>\n\n#define UART_BAUD  115200u\n\n#ifndef APP_NEVER_CONFIRM\n#define APP_NEVER_CONFIRM 0\n#endif\n\nstatic volatile uint32_t s_ticks;\nstatic char s_cmd[32];\nstatic uint32_t s_cmd_len;\nstatic uint32_t s_heartbeat;\nstatic uint32_t s_boot_ms;\n\nint main(void);\n\n/* --------------------------------------------------------------- helpers */\nvoid SysTick_Handler(void)\n{\n    s_ticks++;\n}\n\nstatic uint32_t millis(void)\n{\n    return s_ticks;\n}\n\nstatic void delay_ms(uint32_t ms)\n{\n    uint32_t start = millis();\n\n    while ((millis() - start) < ms) {\n        __NOP();\n    }\n}\n\n#define RX_RING 64\nstatic volatile uint8_t s_rx[RX_RING];\nstatic volatile uint8_t s_rx_head;\nstatic volatile uint8_t s_rx_tail;\n\nvoid USART1_IRQHandler(void)\n{\n    uint32_t sr = USART1->SR;\n\n    if ((sr & (USART_SR_RXNE | USART_SR_ORE)) != 0u) {\n        uint8_t b = (uint8_t)(USART1->DR & 0xFFu);\n        uint8_t next = (uint8_t)((s_rx_head + 1u) % RX_RING);\n\n        if (next != s_rx_tail) {\n            s_rx[s_rx_head] = b;\n            s_rx_head = next;\n        }\n    }\n}\n\nstatic void uart_init(uint32_t baud)\n{\n\n\n    RCC->AHB1ENR |= RCC_AHB1ENR_GPIOAEN;\n    RCC->APB2ENR |= RCC_APB2ENR_USART1EN;\n\n    GPIOA->MODER = (GPIOA->MODER & ~((3u << 18) | (3u << 20))) |\n                   (2u << 18) | (2u << 20);\n    GPIOA->AFR[1] = (GPIOA->AFR[1] & ~((0xFu << 4) | (0xFu << 8))) |\n                    (7u << 4) | (7u << 8);\n    GPIOA->OSPEEDR |= (3u << 18) | (3u << 20);\n    GPIOA->PUPDR = (GPIOA->PUPDR & ~((3u << 18) | (3u << 20))) | (1u << 20);\n    /* Calibrated on this board: USART1 sees an effective 5.25 MHz,\n     * so BRR = 84e6 / baud (115200 -> 729 = 0x2D9, matching the\n     * vendor demo that works on this wiring). */\n    USART1->BRR = (uint16_t)((84000000u + baud / 2u) / baud);\n    USART1->CR1 = USART_CR1_UE | USART_CR1_TE | USART_CR1_RE | USART_CR1_RXNEIE;\n    NVIC_EnableIRQ(USART1_IRQn);\n}\n\nstatic void putc_(char c)\n{\n    while ((USART1->SR & USART_SR_TXE) == 0u) {\n    }\n    USART1->DR = (uint8_t)c;\n}\n\nstatic void print(const char *s)\n{\n    while (*s != '\\0') {\n        putc_(*s++);\n    }\n}\n\nstatic void print_u32(uint32_t v)\n{\n    char buf[11];\n    int i = 10;\n\n    buf[10] = '\\0';\n    do {\n        buf[--i] = (char)('0' + (v % 10u));\n        v /= 10u;\n    } while (v != 0u && i > 0);\n    print(&buf[i]);\n}\n\nstatic void print_hex(uint32_t v)\n{\n    static const char h[] = \"0123456789ABCDEF\";\n    char buf[11];\n    int i;\n\n    buf[0] = '0';\n    buf[1] = 'x';\n    for (i = 0; i < 8; i++) {\n        buf[2 + i] = h[(v >> (28 - 4 * i)) & 0xFu];\n    }\n    buf[10] = '\\0';\n    print(buf);\n}\n\nstatic int getc_(char *c)\n{\n    if (s_rx_tail == s_rx_head) {\n        return 0;\n    }\n    *c = (char)s_rx[s_rx_tail];\n    s_rx_tail = (uint8_t)((s_rx_tail + 1u) % RX_RING);\n    return 1;\n}\n\n/* ------------------------------------------------------------ bootloader */\nstatic ab_api_t *api(void)\n{\n    ab_api_t *p = (ab_api_t *)(uintptr_t)AB_API_ADDR;\n\n    return (p->magic == AB_API_MAGIC) ? p : 0;\n}\n\nstatic uint8_t current_slot(void)\n{\n    return ((uint32_t)(uintptr_t)&main >= AB_SLOT_B_ADDR) ? AB_SLOT_B : AB_SLOT_A;\n}\n\nstatic void print_reset_cause(void)\n{\n    uint32_t csr = RCC->CSR;\n\n    print(\"reset=\");\n    if ((csr & RCC_CSR_IWDGRSTF) != 0u) {\n        print(\"iwdg\");\n    } else if ((csr & RCC_CSR_SFTRSTF) != 0u) {\n        print(\"sw\");\n    } else if ((csr & RCC_CSR_PORRSTF) != 0u) {\n        print(\"por\");\n    } else if ((csr & RCC_CSR_PINRSTF) != 0u) {\n        print(\"pin\");\n    } else {\n        print(\"other\");\n    }\n    RCC->CSR |= RCC_CSR_RMVF;\n}\n\n/* -------------------------------------------------------------- watchdog */\nstatic void iwdg_start(uint32_t timeout_ms)\n{\n    /* LSI 32 kHz, /64 -> 500 Hz, reload = timeout_ms / 2 */\n    IWDG->KR = 0x5555u;\n    IWDG->PR = 4u;\n    IWDG->RLR = timeout_ms / 2u;\n    IWDG->KR = 0xAAAAu;\n    IWDG->KR = 0xCCCCu;\n}\n\nstatic void iwdg_feed(void)\n{\n    IWDG->KR = 0xAAAAu;\n}\n\n/* --------------------------------------------------------------- commands */\nstatic void cmd_info(void)\n{\n    ab_api_t *p = api();\n\n    print(\"info slot=\");\n    print(current_slot() == AB_SLOT_A ? \"A\" : \"B\");\n    print(\" base=\");\n    print_hex(ab_slot_base(current_slot()));\n    print(\" ver=1.0.1 state=\");\n    if (p != 0) {\n        print_u32(p->state());\n    } else {\n        print(\"noapi\");\n    }\n    print(\" uptime=\");\n    print_u32((millis() - s_boot_ms) / 1000u);\n    print(\"s\\r\\n\");\n}\n\nstatic void cmd_boot(void)\n{\n    ab_api_t *p = api();\n\n    print(\"rebooting to bootloader\\r\\n\");\n    delay_ms(50);\n    if (p != 0) {\n        p->request_update();\n    }\n    NVIC_SystemReset();\n}\n\nstatic void cmd_fail(void)\n{\n    print(\"watchdog armed, stopping feed (rollback in ~3 boots)\\r\\n\");\n    for (;;) {\n        /* deliberately stop feeding IWDG */\n    }\n}\n\nstatic void dispatch(const char *line)\n{\n    if (line[0] == '\\0') {\n        return;\n    }\n    if (line[0] == 'b' && line[1] == 'o' && line[2] == 'o' && line[3] == 't') {\n        cmd_boot();\n    } else if (line[0] == 'f' && line[1] == 'a' && line[2] == 'i' && line[3] == 'l') {\n        cmd_fail();\n    } else if (line[0] == 'i' && line[1] == 'n' && line[2] == 'f' && line[3] == 'o') {\n        cmd_info();\n    } else {\n        print(\"commands: info | boot | fail\\r\\n\");\n    }\n}\n\n/* ------------------------------------------------------------------- main */\n/* HSE 8 MHz -> 168 MHz, identical to the original application firmware. */\nstatic void clock_init(void)\n{\n    uint32_t pllcfgr;\n    uint32_t guard;\n\n    RCC->CR |= RCC_CR_HSEON;\n    for (guard = 0; guard < 200000u; guard++) {\n        if ((RCC->CR & RCC_CR_HSERDY) != 0u) {\n            break;\n        }\n    }\n\n    if ((RCC->CR & RCC_CR_HSERDY) != 0u) {\n        pllcfgr = (8u << 0) | (336u << 6) | (0u << 16) |\n                  RCC_PLLCFGR_PLLSRC_HSE | (7u << 24);\n    } else {\n        pllcfgr = (16u << 0) | (336u << 6) | (0u << 16) | (7u << 24);\n    }\n\n    RCC->PLLCFGR = pllcfgr;\n    RCC->CR |= RCC_CR_PLLON;\n    while ((RCC->CR & RCC_CR_PLLRDY) == 0u) {\n    }\n\n    FLASH->ACR = FLASH_ACR_LATENCY_5WS | FLASH_ACR_PRFTEN |\n                 FLASH_ACR_ICEN | FLASH_ACR_DCEN;\n\n    RCC->CFGR = RCC_CFGR_HPRE_DIV1 | RCC_CFGR_PPRE1_DIV4 |\n                RCC_CFGR_PPRE2_DIV2 | RCC_CFGR_SW_PLL;\n    while ((RCC->CFGR & RCC_CFGR_SWS) != RCC_CFGR_SWS_PLL) {\n    }\n\n    /* Do not call SystemCoreClockUpdate(): HSE_VALUE is not defined in this\n     * project, so CMSIS would assume 25 MHz and report 525 MHz. */\n    SystemCoreClock = 168000000u;\n}\n\nstatic void format_version(char *out)\n{\n    uint32_t v = 0u;\n    ab_api_t *p = api();\n\n    if (p != 0 && p->running_version != 0) {\n        v = p->running_version();\n    }\n    if (v == 0u) {\n        v = APP_VERSION;\n    }\n    out[0] = 'v';\n    out[1] = (char)('0' + ((v >> 24) & 0xFu));\n    out[2] = '.';\n    out[3] = (char)('0' + ((v >> 16) & 0xFu));\n    out[4] = '.';\n    out[5] = (char)('0' + ((v >> 8) & 0xFu));\n    out[6] = '\\0';\n}\n\n/* One frame of the OLED animation.  Slot A sweeps an equalizer, slot B bounces\n * a ball, so a glance at the panel tells which slot is running. */\nstatic void oled_tick(uint32_t t)\n{\n    uint8_t slot = current_slot();\n    ab_api_t *p = api();\n    const char *state = (p != 0 && p->state() == AB_ST_TRIAL) ? \"TRIAL\" : \"OK\";\n    uint8_t i;\n\n    oled_clear();\n    oled_text(0, 0, slot == AB_SLOT_A ? \"SLOT A\" : \"SLOT B\");\n    {\n        char ver[8];\n        format_version(ver);\n        oled_text(80, 0, ver);\n    }\n    oled_text(0, 1, state);\n    oled_text2(52, 3, slot == AB_SLOT_A ? \"A\" : \"B\");\n\n    if (slot == AB_SLOT_A) {\n        for (i = 0; i < 10u; i++) {\n            uint8_t h = (uint8_t)(4u + ((t / 120u + i * 3u) % 20u));\n            oled_rect((uint8_t)(4u + i * 12u), (uint8_t)(63u - h), 8u, h, 1u);\n        }\n    } else {\n        uint8_t bx = (uint8_t)(4u + (t / 25u) % 108u);\n        uint8_t by = (uint8_t)(42u + (t / 40u) % 14u);\n        oled_rect(bx, by, 8u, 8u, 1u);\n        oled_rect((uint8_t)(bx + 2u), (uint8_t)(by + 2u), 4u, 4u, 0u);\n        oled_rect(0u, 62u, 128u, 1u, 1u);\n    }\n    oled_flush();\n}\n\nint main(void)\n{\n    ab_api_t *p;\n    uint32_t i;\n\n    /* Defensive: a bootloader jump may leave PRIMASK set. */\n    __enable_irq();\n\n    clock_init();\n    (void)SysTick_Config(SystemCoreClock / 1000u);\n\n    uart_init(UART_BAUD);\n    s_boot_ms = millis();\n\n    oled_init();\n    print(oled_ok() != 0 ? \"oled ok\\r\\n\" : \"oled fail\\r\\n\");\n    if (oled_ok() != 0) {\n        oled_tick(millis());\n    }\n\n    {\n        char ver[8];\n        format_version(ver);\n        print(\"\\r\\napp \");\n        print(ver);\n        print(\" slot=\");\n    }\n    print(current_slot() == AB_SLOT_A ? \"A\" : \"B\");\n    print(\" \");\n    print_reset_cause();\n    print(\"\\r\\n\");\n\n    iwdg_start(4000u);\n\n#if APP_NEVER_CONFIRM\n    /* Rollback demo build: never confirm, never feed the dog.  The bootloader\n     * counts three trial boots and switches back to the previous slot. */\n    print(\"this build never confirms (rollback demo)\\r\\n\");\n    if (oled_ok() != 0) {\n        oled_clear();\n        oled_text2(6, 1, \"BAD\");\n        oled_text2(6, 4, \"FW\");\n        oled_text(0, 7, \"no confirm\");\n        oled_flush();\n    }\n    for (;;) {\n    }\n#endif\n\n    /* Self-test: keep it honest but short.  A real product would check the\n     * sensor, the model CRC and the power rail here. */\n    print(\"selftest\");\n    for (i = 0; i < (3000u / 500u); i++) {\n        delay_ms(500u);\n        iwdg_feed();\n        print(\".\");\n    }\n\n    p = api();\n    if (p == 0) {\n        print(\" no bootloader api, skipping confirm\\r\\n\");\n    } else if (p->state() == AB_ST_TRIAL) {\n        if (p->confirm() == 0u) {\n            print(\" ok, trial confirmed\\r\\n\");\n        } else {\n            print(\" ok, confirm failed\\r\\n\");\n        }\n    } else {\n        print(\" ok\\r\\n\");\n    }\n\n    print(\"running, commands: info | boot | fail\\r\\n\");\n    s_cmd_len = 0u;\n    s_heartbeat = millis();\n\n    for (;;) {\n        char c;\n        static uint32_t s_oled_ms;\n\n        iwdg_feed();\n\n        while (getc_(&c) != 0) {\n            if (c == '\\r' || c == '\\n') {\n                s_cmd[s_cmd_len] = '\\0';\n                dispatch(s_cmd);\n                s_cmd_len = 0u;\n            } else if (s_cmd_len < (sizeof(s_cmd) - 1u)) {\n                s_cmd[s_cmd_len++] = c;\n            }\n        }\n\n        if ((millis() - s_oled_ms) >= 100u) {\n            s_oled_ms = millis();\n            if (oled_ok() != 0) {\n                oled_tick(millis());\n            }\n        }\n\n        if ((millis() - s_heartbeat) >= 1000u) {\n            s_heartbeat = millis();\n            print(\"hb,\");\n            print_u32((millis() - s_boot_ms) / 1000u);\n            print(\"\\r\\n\");\n        }\n    }\n}\n", "app/Src/oled.c": "/**\n * @file  oled.c\n * @brief SSD1306 128x64 on PB8 (SCL) / PB9 (SDA), bit-banged I2C.\n *\n * The hardware I2C1 peripheral wedged in BUSY on this board, so the bus is\n * driven manually.  Open-drain pins + the module's pull-ups do the level\n * shifting; roughly 250 kHz, which is plenty for a 1 KB frame buffer.\n */\n#include \"oled.h\"\n#include \"oled_font.h\"\n#include \"stm32f4xx.h\"\n#include <string.h>\n\n#define OLED_ADDR   0x3Cu\n#define OLED_W      128u\n#define OLED_H      64u\n\nstatic uint8_t s_fb[OLED_W * OLED_H / 8u];\nstatic int s_ok;\nstatic uint8_t s_addr = OLED_ADDR;\n\n/* ------------------------------------------------------------ bit-banged I2C */\nstatic void dly(void)\n{\n    volatile uint32_t i;\n    for (i = 0; i < 250u; i++) {\n        __NOP();\n    }\n}\n\nstatic void scl(uint8_t v)\n{\n    GPIOB->BSRR = (v != 0u) ? (1u << 8) : (1u << (8 + 16));\n}\n\nstatic void sda(uint8_t v)\n{\n    GPIOB->BSRR = (v != 0u) ? (1u << 9) : (1u << (9 + 16));\n}\n\nstatic void bb_start(void)\n{\n    sda(1); dly();\n    scl(1); dly();\n    sda(0); dly();\n    scl(0); dly();\n}\n\nstatic void bb_stop(void)\n{\n    sda(0); dly();\n    scl(1); dly();\n    sda(1); dly();\n}\n\n/* Returns 0 when the byte was acknowledged. */\nstatic int bb_write(uint8_t b)\n{\n    uint8_t i;\n    int ack;\n\n    for (i = 0; i < 8u; i++) {\n        sda((uint8_t)((b & 0x80u) != 0u));\n        dly();\n        scl(1); dly();\n        scl(0); dly();\n        b = (uint8_t)(b << 1);\n    }\n    sda(1); dly();\n    scl(1); dly();\n    ack = (GPIOB->IDR & (1u << 9)) == 0u;\n    scl(0); dly();\n    return ack ? 0 : -1;\n}\n\nstatic void i2c_init(void)\n{\n    RCC->AHB1ENR |= RCC_AHB1ENR_GPIOBEN;\n\n    GPIOB->MODER = (GPIOB->MODER & ~((3u << 16) | (3u << 18))) |\n                   (1u << 16) | (1u << 18);           /* output */\n    GPIOB->OTYPER |= (1u << 8) | (1u << 9);           /* open drain */\n    GPIOB->OSPEEDR |= (3u << 16) | (3u << 18);\n    GPIOB->PUPDR = (GPIOB->PUPDR & ~((3u << 16) | (3u << 18))) |\n                   (1u << 16) | (1u << 18);           /* pull-up */\n    scl(1);\n    sda(1);\n}\n\n/* data[0] is the control byte (0x00 command / 0x40 data). */\nstatic int i2c_write(const uint8_t *data, uint32_t len)\n{\n    uint32_t i;\n\n    bb_start();\n    if (bb_write((uint8_t)(s_addr << 1)) != 0) {\n        bb_stop();\n        return -1;\n    }\n    for (i = 0; i < len; i++) {\n        if (bb_write(data[i]) != 0) {\n            bb_stop();\n            return -1;\n        }\n    }\n    bb_stop();\n    return 0;\n}\n\nstatic int i2c_probe(uint8_t addr)\n{\n    int ack;\n\n    bb_start();\n    ack = bb_write((uint8_t)(addr << 1));\n    bb_stop();\n    return ack;\n}\n\nstatic int oled_cmds(const uint8_t *cmds, uint32_t n)\n{\n    uint8_t buf[32];\n\n    if (n > sizeof(buf) - 1u) {\n        return -1;\n    }\n    buf[0] = 0x00u;\n    memcpy(&buf[1], cmds, n);\n    return i2c_write(buf, n + 1u);\n}\n\n/* ------------------------------------------------------------------ panel */\nstatic const uint8_t s_init[] = {\n    0xAE, 0xD5, 0x80, 0xA8, 0x3F, 0xD3, 0x00, 0x40, 0x8D, 0x14,\n    0x20, 0x00, 0xA1, 0xC8, 0xDA, 0x12, 0x81, 0xCF, 0xD9, 0xF1,\n    0xDB, 0x40, 0xA4, 0xA6, 0x2E, 0xAF,\n};\n\nvoid oled_init(void)\n{\n    i2c_init();\n    memset(s_fb, 0, sizeof(s_fb));\n\n    if (i2c_probe(0x3Cu) == 0) {\n        s_addr = 0x3Cu;\n    } else if (i2c_probe(0x3Du) == 0) {\n        s_addr = 0x3Du;\n    } else {\n        s_ok = 0;\n        return;\n    }\n\n    if (oled_cmds(s_init, sizeof(s_init)) != 0) {\n        s_ok = 0;\n        return;\n    }\n    s_ok = 1;\n    oled_flush();\n}\n\nint oled_ok(void)\n{\n    return s_ok;\n}\n\nvoid oled_clear(void)\n{\n    memset(s_fb, 0, sizeof(s_fb));\n}\n\nstatic void oled_pixel(uint8_t x, uint8_t y)\n{\n    if (x >= OLED_W || y >= OLED_H) {\n        return;\n    }\n    s_fb[(y / 8u) * OLED_W + x] |= (uint8_t)(1u << (y % 8u));\n}\n\nvoid oled_rect(uint8_t x, uint8_t y, uint8_t w, uint8_t h, uint8_t fill)\n{\n    uint8_t i, j;\n\n    for (i = 0; i < w; i++) {\n        for (j = 0; j < h; j++) {\n            if (fill != 0u || i == 0u || j == 0u || i == w - 1u || j == h - 1u) {\n                oled_pixel((uint8_t)(x + i), (uint8_t)(y + j));\n            }\n        }\n    }\n}\n\nstatic void oled_char(uint8_t x, uint8_t page, char c, uint8_t scale)\n{\n    uint8_t idx, col, bit, sx, sy;\n\n    if (c < 32 || c > 127) {\n        c = '?';\n    }\n    idx = (uint8_t)(c - 32);\n    for (col = 0; col < 5u; col++) {\n        uint8_t line = oled_font5x7[idx][col];\n\n        for (bit = 0; bit < 7u; bit++) {\n            if ((line & (1u << bit)) == 0u) {\n                continue;\n            }\n            for (sx = 0; sx < scale; sx++) {\n                for (sy = 0; sy < scale; sy++) {\n                    oled_pixel((uint8_t)(x + col * scale + sx),\n                               (uint8_t)(page * 8u + bit * scale + sy));\n                }\n            }\n        }\n    }\n}\n\nvoid oled_text(uint8_t x, uint8_t page, const char *s)\n{\n    while (*s != '\\0') {\n        oled_char(x, page, *s++, 1u);\n        x = (uint8_t)(x + 6u);\n    }\n}\n\nvoid oled_text2(uint8_t x, uint8_t page, const char *s)\n{\n    while (*s != '\\0') {\n        oled_char(x, page, *s++, 2u);\n        x = (uint8_t)(x + 12u);\n    }\n}\n\nvoid oled_flush(void)\n{\n    uint8_t buf[1 + OLED_W];\n\n    if (s_ok == 0) {\n        return;\n    }\n\n    {\n        static const uint8_t win[] = {0x21, 0x00, 0x7F, 0x22, 0x00, 0x07};\n        if (oled_cmds(win, sizeof(win)) != 0) {\n            s_ok = 0;\n            return;\n        }\n    }\n\n    buf[0] = 0x40u;\n    for (uint32_t page = 0; page < 8u; page++) {\n        memcpy(&buf[1], &s_fb[page * OLED_W], OLED_W);\n        if (i2c_write(buf, sizeof(buf)) != 0) {\n            s_ok = 0;\n            return;\n        }\n    }\n}\n", "app/Src/system_stm32f4xx.c": "/**\n  ******************************************************************************\n  * @file    system_stm32f4xx.c\n  * @author  MCD Application Team\n  * @brief   CMSIS Cortex-M4 Device Peripheral Access Layer System Source File.\n  *\n  *   This file provides two functions and one global variable to be called from \n  *   user application:\n  *      - SystemInit(): This function is called at startup just after reset and \n  *                      before branch to main program. This call is made inside\n  *                      the \"startup_stm32f4xx.s\" file.\n  *\n  *      - SystemCoreClock variable: Contains the core clock (HCLK), it can be used\n  *                                  by the user application to setup the SysTick \n  *                                  timer or configure other parameters.\n  *                                     \n  *      - SystemCoreClockUpdate(): Updates the variable SystemCoreClock and must\n  *                                 be called whenever the core clock is changed\n  *                                 during program execution.\n  *\n  *\n  ******************************************************************************\n  * @attention\n  *\n  * Copyright (c) 2017 STMicroelectronics.\n  * All rights reserved.\n  *\n  * This software is licensed under terms that can be found in the LICENSE file\n  * in the root directory of this software component.\n  * If no LICENSE file comes with this software, it is provided AS-IS.\n  *\n  ******************************************************************************\n  */\n\n/** @addtogroup CMSIS\n  * @{\n  */\n\n/** @addtogroup stm32f4xx_system\n  * @{\n  */  \n  \n/** @addtogroup STM32F4xx_System_Private_Includes\n  * @{\n  */\n\n\n#include \"stm32f4xx.h\"\n\n#if !defined  (HSE_VALUE) \n  #define HSE_VALUE    ((uint32_t)25000000) /*!< Default value of the External oscillator in Hz */\n#endif /* HSE_VALUE */\n\n#if !defined  (HSI_VALUE)\n  #define HSI_VALUE    ((uint32_t)16000000) /*!< Value of the Internal oscillator in Hz*/\n#endif /* HSI_VALUE */\n\n/**\n  * @}\n  */\n\n/** @addtogroup STM32F4xx_System_Private_TypesDefinitions\n  * @{\n  */\n\n/**\n  * @}\n  */\n\n/** @addtogroup STM32F4xx_System_Private_Defines\n  * @{\n  */\n\n/************************* Miscellaneous Configuration ************************/\n/*!< Uncomment the following line if you need to use external SRAM or SDRAM as data memory  */\n#if defined(STM32F405xx) || defined(STM32F415xx) || defined(STM32F407xx) || defined(STM32F417xx)\\\n || defined(STM32F427xx) || defined(STM32F437xx) || defined(STM32F429xx) || defined(STM32F439xx)\\\n || defined(STM32F469xx) || defined(STM32F479xx) || defined(STM32F412Zx) || defined(STM32F412Vx)\n/* #define DATA_IN_ExtSRAM */\n#endif /* STM32F40xxx || STM32F41xxx || STM32F42xxx || STM32F43xxx || STM32F469xx || STM32F479xx ||\\\n          STM32F412Zx || STM32F412Vx */\n \n#if defined(STM32F427xx) || defined(STM32F437xx) || defined(STM32F429xx) || defined(STM32F439xx)\\\n || defined(STM32F446xx) || defined(STM32F469xx) || defined(STM32F479xx)\n/* #define DATA_IN_ExtSDRAM */\n#endif /* STM32F427xx || STM32F437xx || STM32F429xx || STM32F439xx || STM32F446xx || STM32F469xx ||\\\n          STM32F479xx */\n\n/* Note: Following vector table addresses must be defined in line with linker\n         configuration. */\n/*!< Uncomment the following line if you need to relocate the vector table\n     anywhere in Flash or Sram, else the vector table is kept at the automatic\n     remap of boot address selected */\n/* #define USER_VECT_TAB_ADDRESS */\n\n#if defined(USER_VECT_TAB_ADDRESS)\n/*!< Uncomment the following line if you need to relocate your vector Table\n     in Sram else user remap will be done in Flash. */\n/* #define VECT_TAB_SRAM */\n#if defined(VECT_TAB_SRAM)\n#define VECT_TAB_BASE_ADDRESS   SRAM_BASE       /*!< Vector Table base address field.\n                                                     This value must be a multiple of 0x200. */\n#else\n#define VECT_TAB_BASE_ADDRESS   FLASH_BASE      /*!< Vector Table base address field.\n                                                     This value must be a multiple of 0x200. */\n#endif /* VECT_TAB_SRAM */\n#if !defined(VECT_TAB_OFFSET)\n#define VECT_TAB_OFFSET         0x00000000U     /*!< Vector Table offset field.\n                                                     This value must be a multiple of 0x200. */\n#endif /* VECT_TAB_OFFSET */\n#endif /* USER_VECT_TAB_ADDRESS */\n/******************************************************************************/\n\n/**\n  * @}\n  */\n\n/** @addtogroup STM32F4xx_System_Private_Macros\n  * @{\n  */\n\n/**\n  * @}\n  */\n\n/** @addtogroup STM32F4xx_System_Private_Variables\n  * @{\n  */\n  /* This variable is updated in three ways:\n      1) by calling CMSIS function SystemCoreClockUpdate()\n      2) by calling HAL API function HAL_RCC_GetHCLKFreq()\n      3) each time HAL_RCC_ClockConfig() is called to configure the system clock frequency \n         Note: If you use this function to configure the system clock; then there\n               is no need to call the 2 first functions listed above, since SystemCoreClock\n               variable is updated automatically.\n  */\nuint32_t SystemCoreClock = 16000000;\nconst uint8_t AHBPrescTable[16] = {0, 0, 0, 0, 0, 0, 0, 0, 1, 2, 3, 4, 6, 7, 8, 9};\nconst uint8_t APBPrescTable[8]  = {0, 0, 0, 0, 1, 2, 3, 4};\n/**\n  * @}\n  */\n\n/** @addtogroup STM32F4xx_System_Private_FunctionPrototypes\n  * @{\n  */\n\n#if defined (DATA_IN_ExtSRAM) || defined (DATA_IN_ExtSDRAM)\n  static void SystemInit_ExtMemCtl(void); \n#endif /* DATA_IN_ExtSRAM || DATA_IN_ExtSDRAM */\n\n/**\n  * @}\n  */\n\n/** @addtogroup STM32F4xx_System_Private_Functions\n  * @{\n  */\n\n/**\n  * @brief  Setup the microcontroller system\n  *         Initialize the FPU setting, vector table location and External memory \n  *         configuration.\n  * @param  None\n  * @retval None\n  */\nvoid SystemInit(void)\n{\n  /* FPU settings ------------------------------------------------------------*/\n  #if (__FPU_PRESENT == 1) && (__FPU_USED == 1)\n    SCB->CPACR |= ((3UL << 10*2)|(3UL << 11*2));  /* set CP10 and CP11 Full Access */\n  #endif\n\n#if defined (DATA_IN_ExtSRAM) || defined (DATA_IN_ExtSDRAM)\n  SystemInit_ExtMemCtl(); \n#endif /* DATA_IN_ExtSRAM || DATA_IN_ExtSDRAM */\n\n  /* Configure the Vector Table location -------------------------------------*/\n#if defined(USER_VECT_TAB_ADDRESS)\n  SCB->VTOR = VECT_TAB_BASE_ADDRESS | VECT_TAB_OFFSET; /* Vector Table Relocation in Internal SRAM */\n#endif /* USER_VECT_TAB_ADDRESS */\n}\n\n/**\n   * @brief  Update SystemCoreClock variable according to Clock Register Values.\n  *         The SystemCoreClock variable contains the core clock (HCLK), it can\n  *         be used by the user application to setup the SysTick timer or configure\n  *         other parameters.\n  *           \n  * @note   Each time the core clock (HCLK) changes, this function must be called\n  *         to update SystemCoreClock variable value. Otherwise, any configuration\n  *         based on this variable will be incorrect.         \n  *     \n  * @note   - The system frequency computed by this function is not the real \n  *           frequency in the chip. It is calculated based on the predefined \n  *           constant and the selected clock source:\n  *             \n  *           - If SYSCLK source is HSI, SystemCoreClock will contain the HSI_VALUE(*)\n  *                                              \n  *           - If SYSCLK source is HSE, SystemCoreClock will contain the HSE_VALUE(**)\n  *                          \n  *           - If SYSCLK source is PLL, SystemCoreClock will contain the HSE_VALUE(**) \n  *             or HSI_VALUE(*) multiplied/divided by the PLL factors.\n  *         \n  *         (*) HSI_VALUE is a constant defined in stm32f4xx_hal_conf.h file (default value\n  *             16 MHz) but the real value may vary depending on the variations\n  *             in voltage and temperature.   \n  *    \n  *         (**) HSE_VALUE is a constant defined in stm32f4xx_hal_conf.h file (its value\n  *              depends on the application requirements), user has to ensure that HSE_VALUE\n  *              is same as the real frequency of the crystal used. Otherwise, this function\n  *              may have wrong result.\n  *                \n  *         - The result of this function could be not correct when using fractional\n  *           value for HSE crystal.\n  *     \n  * @param  None\n  * @retval None\n  */\nvoid SystemCoreClockUpdate(void)\n{\n  uint32_t tmp, pllvco, pllp, pllsource, pllm;\n  \n  /* Get SYSCLK source -------------------------------------------------------*/\n  tmp = RCC->CFGR & RCC_CFGR_SWS;\n\n  switch (tmp)\n  {\n    case 0x00:  /* HSI used as system clock source */\n      SystemCoreClock = HSI_VALUE;\n      break;\n    case 0x04:  /* HSE used as system clock source */\n      SystemCoreClock = HSE_VALUE;\n      break;\n    case 0x08:  /* PLL used as system clock source */\n\n      /* PLL_VCO = (HSE_VALUE or HSI_VALUE / PLL_M) * PLL_N\n         SYSCLK = PLL_VCO / PLL_P\n         */    \n      pllsource = (RCC->PLLCFGR & RCC_PLLCFGR_PLLSRC) >> 22;\n      pllm = RCC->PLLCFGR & RCC_PLLCFGR_PLLM;\n      \n      if (pllsource != 0)\n      {\n        /* HSE used as PLL clock source */\n        pllvco = (HSE_VALUE / pllm) * ((RCC->PLLCFGR & RCC_PLLCFGR_PLLN) >> 6);\n      }\n      else\n      {\n        /* HSI used as PLL clock source */\n        pllvco = (HSI_VALUE / pllm) * ((RCC->PLLCFGR & RCC_PLLCFGR_PLLN) >> 6);\n      }\n\n      pllp = (((RCC->PLLCFGR & RCC_PLLCFGR_PLLP) >>16) + 1 ) *2;\n      SystemCoreClock = pllvco/pllp;\n      break;\n    default:\n      SystemCoreClock = HSI_VALUE;\n      break;\n  }\n  /* Compute HCLK frequency --------------------------------------------------*/\n  /* Get HCLK prescaler */\n  tmp = AHBPrescTable[((RCC->CFGR & RCC_CFGR_HPRE) >> 4)];\n  /* HCLK frequency */\n  SystemCoreClock >>= tmp;\n}\n\n#if defined (DATA_IN_ExtSRAM) && defined (DATA_IN_ExtSDRAM)\n#if defined(STM32F427xx) || defined(STM32F437xx) || defined(STM32F429xx) || defined(STM32F439xx)\\\n || defined(STM32F469xx) || defined(STM32F479xx)\n/**\n  * @brief  Setup the external memory controller.\n  *         Called in startup_stm32f4xx.s before jump to main.\n  *         This function configures the external memories (SRAM/SDRAM)\n  *         This SRAM/SDRAM will be used as program data memory (including heap and stack).\n  * @param  None\n  * @retval None\n  */\nvoid SystemInit_ExtMemCtl(void)\n{\n  __IO uint32_t tmp = 0x00;\n\n  register uint32_t tmpreg = 0, timeout = 0xFFFF;\n  register __IO uint32_t index;\n\n  /* Enable GPIOC, GPIOD, GPIOE, GPIOF, GPIOG, GPIOH and GPIOI interface clock */\n  RCC->AHB1ENR |= 0x000001F8;\n\n  /* Delay after an RCC peripheral clock enabling */\n  tmp = READ_BIT(RCC->AHB1ENR, RCC_AHB1ENR_GPIOCEN);\n  \n  /* Connect PDx pins to FMC Alternate function */\n  GPIOD->AFR[0]  = 0x00CCC0CC;\n  GPIOD->AFR[1]  = 0xCCCCCCCC;\n  /* Configure PDx pins in Alternate function mode */  \n  GPIOD->MODER   = 0xAAAA0A8A;\n  /* Configure PDx pins speed to 100 MHz */  \n  GPIOD->OSPEEDR = 0xFFFF0FCF;\n  /* Configure PDx pins Output type to push-pull */  \n  GPIOD->OTYPER  = 0x00000000;\n  /* No pull-up, pull-down for PDx pins */ \n  GPIOD->PUPDR   = 0x00000000;\n\n  /* Connect PEx pins to FMC Alternate function */\n  GPIOE->AFR[0]  = 0xC00CC0CC;\n  GPIOE->AFR[1]  = 0xCCCCCCCC;\n  /* Configure PEx pins in Alternate function mode */ \n  GPIOE->MODER   = 0xAAAA828A;\n  /* Configure PEx pins speed to 100 MHz */ \n  GPIOE->OSPEEDR = 0xFFFFC3CF;\n  /* Configure PEx pins Output type to push-pull */  \n  GPIOE->OTYPER  = 0x00000000;\n  /* No pull-up, pull-down for PEx pins */ \n  GPIOE->PUPDR   = 0x00000000;\n  \n  /* Connect PFx pins to FMC Alternate function */\n  GPIOF->AFR[0]  = 0xCCCCCCCC;\n  GPIOF->AFR[1]  = 0xCCCCCCCC;\n  /* Configure PFx pins in Alternate function mode */   \n  GPIOF->MODER   = 0xAA800AAA;\n  /* Configure PFx pins speed to 50 MHz */ \n  GPIOF->OSPEEDR = 0xAA800AAA;\n  /* Configure PFx pins Output type to push-pull */  \n  GPIOF->OTYPER  = 0x00000000;\n  /* No pull-up, pull-down for PFx pins */ \n  GPIOF->PUPDR   = 0x00000000;\n\n  /* Connect PGx pins to FMC Alternate function */\n  GPIOG->AFR[0]  = 0xCCCCCCCC;\n  GPIOG->AFR[1]  = 0xCCCCCCCC;\n  /* Configure PGx pins in Alternate function mode */ \n  GPIOG->MODER   = 0xAAAAAAAA;\n  /* Configure PGx pins speed to 50 MHz */ \
